[project]
name = "yerkon"
version = "1.0.0"
description = "Simulates the YERKON deployment cases and produces four comparison-table rows"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
image = ["matplotlib>=3.7"]
dev = ["pytest>=7.4,<9"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yerkon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
