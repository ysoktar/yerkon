[project]
name = "yerkon"
version = "0.1.0"
description = "What a YERKON terrestrial positioning network delivers, and what it costs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
yerkon = "yerkon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sites = ["rasterio>=1.3", "requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yerkon" = ["defaults.toml"]
"yerkon.viewer" = ["static/*"]
# Fetched Ankara ground. A megabyte, and the reason an install reproduces
# the table's numbers with no network (ADR-0008, ADR-0021).
"yerkon.site" = ["ankara/*/*.npy", "ankara/*/*.npz", "ankara/*/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: runs a full scenario end to end; seconds rather than milliseconds",
]
