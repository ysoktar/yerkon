<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YERKON</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="scene"></div>

<!--
  The panel is ordered the way somebody works, not the way the engine is
  built: where the site is, what shape it is, what stands on it, what it
  has to achieve, what that rests on, and what to run. Each step collapses
  to a line carrying its own state, so the whole study reads at a glance
  and only the step being worked on is open.
-->
<aside id="panel">
  <!--
    The way back. The simulator is one page of a site (ADR-0064), and a
    page somebody arrived at through a link has to say how to leave it.
  -->
  <a id="back" href="index.html" data-say="back.site"></a>
  <h1>YERKON</h1>
  <p class="sub" id="terrain-note">-</p>

  <!--
    Which row, what to search for, and which language belong to the whole
    panel rather than to the step that happens to be open, so they stay
    pinned while the steps scroll under them.
  -->
  <div id="top">
    <nav id="tabs"></nav>

    <div class="find">
      <input type="search" id="find" data-say-placeholder="find.placeholder"
             autocomplete="off">
      <button id="find-clear" class="quiet" data-say-title="find.clear">✕</button>
      <!--
        Both languages at once rather than a menu: there are two, and a
        two-item menu costs a click to find out what is in it.
      -->
      <nav id="languages"></nav>
    </div>
  </div>
  <p class="hint no-hits" id="find-empty" data-say="find.empty" hidden></p>

  <!--
    Named arrangements. Under the tabs because that is what it is about:
    which arrangement this tab is showing. One per tab, separately —
    loading one replaces this tab and touches no other (ADR-0043).
  -->
  <div id="presets">
    <select id="preset-pick"></select>
    <button id="preset-load" class="quiet" data-say="preset.load"></button>
    <div class="row">
      <input type="text" id="preset-name" data-say-placeholder="preset.name">
      <button id="preset-save" class="quiet" data-say="preset.save"></button>
      <button id="preset-drop" class="quiet" data-say="preset.drop"></button>
    </div>
  </div>

  <details class="step" id="step-place" open>
    <summary><span class="n">1</span><span class="what" data-say="step.place"></span>
      <span class="now" id="sum-place">-</span></summary>

    <label data-find="zemin yer saha arazi site ground"><span data-say="ground.pick"></span>
      <select id="site"></select></label>
    <p class="hint" id="ground-note">-</p>

    <details id="fetch-panel" data-find="getir indir yeni yer openstreetmap
                                        copernicus enlem boylam kutu">
      <summary data-say="fetch.open"></summary>
      <!--
        Said before a place is picked rather than after a fetch has gone
        looking for one: the packages this needs are not dependencies of
        the package, because the table is reproducible from the ground
        shipped inside it with no network at all (ADR-0008, ADR-0051).
      -->
      <p class="hint no-hits" id="fetch-cannot" hidden></p>
      <p class="hint" data-say="fetch.note"></p>
      <label><span data-say="fetch.name"></span> <input type="text" id="fetch-name" placeholder="ör. izmir"></label>
      <!--
        A centre and a size, not four corners: what somebody looking at a
        map has is a pin and a sense of how much ground around it. Any map
        gives the pin by right-clicking it.
      -->
      <label><span data-say="fetch.centre"></span>
        <input type="text" id="fetch-centre" required
               placeholder="39,9250 32,8370"></label>
      <div class="row"><button id="open-map" class="quiet"
        data-say="fetch.map.open"></button></div>
      <!--
        The box a map hands over is a rectangle and the size knob holds
        one number, so while there is one the knob stands down and this
        line carries the way back (ADR-0052).
      -->
      <p class="hint" id="fetch-picked" hidden><span id="fetch-picked-what"></span>
        <button id="fetch-picked-drop" class="quiet" data-say="fetch.map.drop"></button></p>
      <label class="knob"><span data-say="fetch.size"></span><output id="fetch-size-out"></output>
        <input type="range" id="fetch-size" min="1" max="40" step="1" value="3">
        <input type="number" id="fetch-size-num" class="num" step="1"></label>
      <p class="hint" id="fetch-box">-</p>
      <label><span data-say="fetch.spacing"></span>
        <input type="number" id="fetch-spacing" value="30" step="10"></label>
      <label class="tick"><input type="checkbox" id="fetch-buildings" checked>
        <span data-say="fetch.buildings"></span></label>
      <!--
        A tick rather than a tile address. The project owner chose the
        provider, so nobody has to find and paste one; the credit it asks
        for sits under the tick (ADR-0086).
      -->
      <label class="tick"><input type="checkbox" id="fetch-imagery" checked>
        <span data-say="fetch.imagery"></span></label>
      <p class="hint" data-say="fetch.imagery.note"></p>
      <div class="row"><button id="run-fetch" class="quiet" data-say="fetch.go"></button></div>
      <div id="fetch-out"></div>
    </details>

    <p class="hint" id="modelled-note" data-say="ground.modelled.note"></p>

    <!--
      Drawn, never read. The photograph colours the ground and nothing
      else: a link budget does not care what colour a field is. Greyed
      where the fetched site has none, because a tick that changes
      nothing is not a tick (ADR-0036).
    -->
    <label class="tick" id="photo-tick" data-find="uydu fotoğraf hava görüntüsü harita satellite aerial photograph imagery">
      <input type="checkbox" id="show-photo" checked>
      <span data-say="ground.photo"></span></label>

    <label class="knob" data-find="tepe yükseklik rölyef relief modellenmiş">
      <span data-say="knob.relief"></span><output id="relief-out"></output>
      <input type="range" id="relief_m" min="5" max="1000" step="5">
      <input type="number" id="relief_m-num" class="num" step="5"></label>
    <label class="knob" data-find="tepe aralık dalga boyu modellenmiş">
      <span data-say="knob.hills"></span><output id="hill-out"></output>
      <input type="range" id="hill_spacing_m" min="500" max="10000" step="250">
      <input type="number" id="hill_spacing_m-num" class="num" step="250"></label>
    <label class="knob" data-find="yüzey pürüz roughness saçılma">
      <span data-say="knob.roughness"></span><output id="rough-out"></output>
      <input type="range" id="roughness_m" min="0" max="2" step="0.05" data-cascades>
      <input type="number" id="roughness_m-num" class="num" step="0.05"></label>
    <label class="knob" data-find="engel kaybı clutter bina ağaç soğurma">
      <span data-say="knob.clutter"></span><output id="clutter-out"></output>
      <input type="range" id="clutter_db_per_km" min="0" max="60" step="2">
      <input type="number" id="clutter_db_per_km-num" class="num" step="2"></label>
  </details>

  <details class="step" id="step-site">
    <summary><span class="n">2</span><span class="what" data-say="step.site"></span>
      <span class="now" id="sum-site">-</span></summary>

    <p class="hint" data-say="site.rows"></p>
    <!--
      Ten metres, not five hundred.
      A fetch comes back at whatever the grid came back at — Kızılay is
      2970 m — and a coarse step cannot land there, so the browser rounded
      the handle down and the slider read 2500 beside a box reading 2970.
      The handle said one thing and the site was another (ADR-0048).
    -->
    <label class="knob" data-find="boy koridor uzunluk saha">
      <span data-say="knob.length"></span><output id="corridor-out"></output>
      <input type="range" id="corridor_m" min="500" max="40000" step="10"
             data-cascades>
      <input type="number" id="corridor_m-num" class="num" step="10"></label>
    <label class="knob" data-find="en genişlik alan koridor saha">
      <span data-say="knob.width"></span><output id="width-out"></output>
      <input type="range" id="width_m" min="0" max="40000" step="10"
             data-cascades>
      <input type="number" id="width_m-num" class="num" step="10"></label>
    <!--
      Why a number came back smaller than the one that was typed. Beside
      the knobs rather than in the status line: the status line is for
      what is happening now and the sweep overwrites it a moment later,
      which left the explanation on screen for about a second (ADR-0048).
    -->
    <p class="hint no-hits" id="site-clipped" hidden></p>
    <p class="hint" data-say="site.shape"></p>
  </details>

  <details class="step" id="step-layout">
    <summary><span class="n">3</span><span class="what" data-say="step.layout"></span>
      <span class="now" id="sum-layout">-</span></summary>

    <h2 data-say="runs.head"></h2>
    <div id="runs"></div>
    <div class="row"><button id="add-run" class="quiet" data-say="runs.add"></button></div>

    <h2 data-say="units.head"></h2>
    <div id="units"></div>
    <div class="row"><button id="add-unit" class="quiet" data-say="units.add"></button></div>

    <p class="hint" data-say="layout.note"></p>
  </details>

  <details class="step" id="step-target">
    <summary><span class="n">4</span><span class="what" data-say="step.target"></span>
      <span class="now" id="sum-target">-</span></summary>

    <label data-find="bölge mevzuat eirp güç yasal region region"><span data-say="target.region"></span>
      <select id="region" data-cascades></select></label>
    <label data-find="ölçüm şema twr tek çift yön scheme"><span data-say="target.scheme"></span>
      <select id="scheme"></select></label>
    <label class="knob" data-find="menzil tolerans hassasiyet sigma hedef">
      <span data-say="knob.tolerance"></span><output id="tol-out"></output>
      <input type="range" id="tolerance_m" min="0.1" max="30" step="0.1"
             data-cascades>
      <input type="number" id="tolerance_m-num" class="num" step="0.1"></label>
    <label class="knob" data-find="yolculuk süre sefer dakika">
      <span data-say="knob.journey"></span><output id="journey-out"></output>
      <input type="range" id="journey_s" min="30" max="3600" step="30">
      <input type="number" id="journey_s-num" class="num" step="30"></label>
    <label class="knob" data-find="tarama hücre çözünürlük kapsama grid">
      <span data-say="knob.sweep"></span><output id="sweep-out"></output>
      <input type="range" id="sweep_m" min="50" max="1000" step="50">
      <input type="number" id="sweep_m-num" class="num" step="50"></label>
  </details>

  <details class="step" id="step-basis">
    <summary><span class="n">5</span><span class="what" data-say="step.basis"></span>
      <span class="now" id="sum-basis">-</span></summary>

    <h2 data-say="options.head"></h2>
    <p class="hint" data-say="options.note"></p>
    <div id="options"></div>

    <h2><span data-say="figures.head"></span> <span id="assumed-count" class="tag"></span></h2>
    <p class="hint" data-say="figures.note"></p>
    <div class="prov-key">
      <span><i class="prov datasheet"></i><span data-say="prov.datasheet"></span></span>
      <span><i class="prov measurement"></i><span data-say="prov.measurement"></span></span>
      <span><i class="prov standard"></i><span data-say="prov.standard"></span></span>
      <span><i class="prov derived"></i><span data-say="prov.derived"></span></span>
      <span><i class="prov design"></i><span data-say="prov.design"></span></span>
      <span><i class="prov assumption"></i><span data-say="prov.assumption"></span></span>
    </div>
    <label class="tick"><input type="checkbox" id="only-assumed">
      <span data-say="figures.only_assumed"></span></label>
    <div id="figures"></div>
    <div class="row">
      <a id="export" class="button quiet" href="api/figures.toml"
         download="defaults.toml" data-say="figures.export"></a>
      <button id="clear-overrides" class="quiet" data-say="figures.undo"></button>
    </div>
  </details>

  <details class="step" id="step-run">
    <summary><span class="n">6</span><span class="what" data-say="step.run"></span>
      <span class="now" id="sum-run">-</span></summary>

    <p class="hint" data-say="run.note"></p>
    <label data-find="hangi satır tablo rows"><span data-say="run.which"></span>
      <select id="task-only"></select></label>
    <div class="row">
      <button id="run-table" class="quiet" data-say="run.table"></button>
      <button id="run-budget" class="quiet" data-say="run.budget"></button>
    </div>
    <label data-find="teslim klasör markdown rapor deliver"><span data-say="deliver.into"></span>
      <input type="text" id="deliver-into" value="docs/teslim"></label>
    <label class="tick"><input type="checkbox" id="deliver-budget" checked>
      <span data-say="deliver.budget"></span></label>
    <div class="row">
      <button id="run-deliver" class="quiet" data-say="deliver.go"></button>
    </div>
    <div id="task-out"></div>

    <h2 data-say="solve.head"></h2>
    <p class="hint" data-say="solve.note"></p>
    <label data-find="çözücü senaryo row"><span data-say="solve.scenario"></span>
      <select id="solve-scenario"></select></label>
    <div class="pair" data-find="çözücü koşul hedef kullanılabilirlik hpe">
      <label><span data-say="solve.availability"></span>
        <input type="number" id="solve-availability" step="0.01"
               min="0" max="1" placeholder="0,95"></label>
      <label><span data-say="solve.hpe50"></span>
        <input type="number" id="solve-hpe50" step="0.1" placeholder="-"></label>
      <label><span data-say="solve.hpe95"></span>
        <input type="number" id="solve-hpe95" step="0.1" placeholder="-"></label>
      <label><span data-say="solve.fixes"></span>
        <input type="number" id="solve-fixes" step="0.1" placeholder="-"></label>
    </div>
    <div id="solve-vary"></div>
    <label data-find="çözücü kaydet ad seçenek save"><span data-say="solve.save_as"></span>
      <input type="text" id="solve-save" placeholder="ör. kirsal-hedef"></label>
    <div class="row"><button id="run-solve" data-say="solve.go"></button></div>
    <div id="solve-out"></div>

    <h2 data-say="place.head"></h2>
    <p class="hint" data-say="place.note"></p>
    <label data-find="yöneylem yerleştir çatı tepe direk place rooftop hilltop"><span data-say="place.aim"></span>
      <select id="place-aim">
        <option value="better" data-say="place.better"></option>
        <option value="cheaper" data-say="place.cheaper"></option>
      </select></label>
    <div class="row"><button id="run-place" data-say="place.go"></button></div>
    <div id="place-out"></div>
  </details>

  <section id="readout">
    <h2 data-say="result.head"></h2>
    <dl id="numbers"></dl>
    <div class="row">
      <button id="run" data-say="result.run"></button>
      <button id="hurry" class="quiet" data-say="result.hurry"></button>
      <button id="reset" class="quiet" data-say="result.reset"></button>
    </div>
  </section>
</aside>

<div id="confirm" hidden>
  <div class="sheet">
    <h2 data-say="confirm.head"></h2>
    <div id="confirm-body"></div>
    <div class="row">
      <button id="confirm-yes" data-say="confirm.yes"></button>
      <button id="confirm-no" class="quiet" data-say="confirm.no"></button>
    </div>
  </div>
</div>

<!--
  The map. Full screen on purpose: a 340 px panel can hold a slider but
  not a place, and picking ground on a map the size of a postage stamp is
  the same transcription problem in a smaller box.
-->
<div id="map-sheet" hidden>
  <div class="map-bar">
    <input type="search" id="map-search" data-say-placeholder="fetch.map.search">
    <button id="map-find" class="quiet" data-say="fetch.map.find"></button>
    <button id="map-draw" class="quiet" data-say="fetch.map.draw"></button>
    <span class="map-span" id="map-span">-</span>
    <button id="map-take" data-say="fetch.map.take"></button>
    <button id="map-close" class="quiet" data-say="fetch.map.close"></button>
  </div>
  <div id="map-hits" hidden></div>
  <div id="map-canvas"></div>
  <p class="map-credit" id="map-credit"></p>
</div>

<div id="controls-hint">
  <span id="gestures"></span>
  <button id="frame-all" class="quiet" data-say="scene.frame"></button>
</div>

<!--
  The legend, and what the ground overlay is reading.
  The four bands are filled in from the engine's own thresholds, so the
  colours and the numbers beside them cannot disagree (ADR-0044).
-->
<div id="legend">
  <select id="layer-pick" title=""></select>
  <div id="legend-bands"></div>
  <span><i class="reach"></i><span data-say="legend.reach"></span></span>
  <span><i class="unit"></i><span data-say="legend.unit"></span></span>
</div>

<div id="status"></div>

<script src="local.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
