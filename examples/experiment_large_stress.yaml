# Larger experiment configuration, used to validate the generator and
# pipeline at a scenario count well beyond the standard example. Not run
# by scripts/run.sh by default (it takes longer); run it explicitly with:
#
#   python -m locbench3d.cli run-all --config examples/experiment_large_stress.yaml --out output/stress

template:
  width_m: 25.0
  length_m: 25.0
  height_m: 8.0
  frame_duration_s: 0.001
  guard_duration_s: 0.0002
  scheduling_model: scheduled
  nlos_probability: 0.05
  nlos_bias_m: 0.4
  timing_uncertainty_m: 0.12

variables:
  method: ["UWB_SS_TWR", "UWB_DS_TWR", "TDOA", "TOA"]
  anchor_count: [4, 5, 6, 8]
  tag_count: [1, 5, 10]
  update_rate_hz: [1.0, 2.0, 5.0]
  hardware_profile: [null, "Semtech SX1280"]

n_repeats: 8
seed: 1

range_bin_edges_m: [0, 5, 10, 15, 20, 30, 45]

hard_requirements:
  max_3d_p95_m: 4.0
  min_availability: 0.7
  min_supported_tags: 1
