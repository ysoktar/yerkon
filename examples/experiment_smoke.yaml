# Smoke-test experiment: small enough to run in a few seconds.
# Used by `locbench3d run-all --smoke` and by the release validation pass.
template:
  width_m: 10.0
  length_m: 10.0
  height_m: 4.0
  frame_duration_s: 0.001
  guard_duration_s: 0.0002
  scheduling_model: scheduled

variables:
  method: ["UWB_SS_TWR", "TDOA"]
  anchor_count: [5]
  tag_count: [1]
  update_rate_hz: [1.0]

n_repeats: 10
seed: 0

range_bin_edges_m: [0, 5, 10, 20]

hard_requirements:
  max_3d_p95_m: 5.0
  min_availability: 0.5
