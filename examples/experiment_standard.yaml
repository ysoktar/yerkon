# Standard experiment: broader sweep across method, anchor/tag count,
# update rate, and hardware profile.
#
# SX1280_RANGING is run here in a multilateration deployment (>=4 anchors),
# not the literal 2-radio pairwise configuration from the requirements
# table. The pairwise, published-field-test view of SX1280 ranging accuracy
# lives in the sx1280_published_data sheet (Stuart Robinson's observations),
# not in this Monte Carlo scenario sweep; see docs/LIMITATIONS.md.

template:
  width_m: 20.0
  length_m: 20.0
  height_m: 6.0
  frame_duration_s: 0.001
  guard_duration_s: 0.0002
  scheduling_model: scheduled
  nlos_probability: 0.1
  nlos_bias_m: 0.5
  timing_uncertainty_m: 0.15

variables:
  method: ["UWB_SS_TWR", "UWB_DS_TWR", "TDOA", "SX1280_RANGING"]
  anchor_count: [4, 5, 8]
  tag_count: [1, 10]
  update_rate_hz: [1.0, 5.0]
  hardware_profile: [null, "Semtech SX1280"]

n_repeats: 20
seed: 0

range_bin_edges_m: [0, 5, 10, 20, 30, 50]

hard_requirements:
  max_3d_p95_m: 3.0
  max_horizontal_p95_m: 2.0
  min_availability: 0.8
  min_supported_tags: 1

gnss_log_path: examples/gnss_sample_log.csv
