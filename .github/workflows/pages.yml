# Puts the site on GitHub Pages.
#
# The site is a folder of files in the repository rather than something
# built here (ADR-0065), so this uploads what is committed. A test says
# that folder is what the pages draw, which makes the bytes on the
# address the same bytes somebody reviewed in the diff.
#
# `enablement: true` turns Pages on if it is off, so that switching the
# site on is a push rather than somebody finding a setting.
name: Pages

on:
  push:
    branches: [claude/3d-localization-benchmark-bm3unn]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push wins rather than waiting behind
# an older one, because what is wanted is the current site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
