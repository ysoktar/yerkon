note_en = """Tunnel brackets at 40 m instead of 60 m. A placement search tried arrangements of the tunnel row against the real ground it stands on and found this the cheapest to meet availability ≥ 99,0 % and HPE P50 ≤ 1,00 m. Every candidate was a full simulation, so the result comes from the same engine as the table. It takes half as many brackets again, and the cost per kilometre rises with them."""

