name = 'rural-dense'
title = 'Kırsal: 2,5 km ızgara, dağıtım direkleri'
title_en = 'Rural: a 2,5 km grid on distribution poles'
origin = 'shipped'
note = """Üç kilometre aralıklı kırk dokuz dağıtım direği yerine iki buçuk \
kilometre aralıklı altmış sekiz direk kullanılmaktadır: direk sayısı \
%39 artmaktadır. Hızlı hesapta kullanılabilirlik birkaç puan artarken \
kilometrekare başına maliyet daha fazla artmaktadır. \
Kullanılabilirliği yükseltmek için yayın birimi yüksekliği veya bir \
turda ölçüm yapılan direk sayısı da değiştirilebilir."""
note_en = """Sixty eight distribution poles at two and a half kilometres instead of forty nine at three: 39 % more poles. On a coarse read availability rises by a few points and the cost per square kilometre rises by more. Height or how many units a receiver polls in a round are other ways to raise availability."""

