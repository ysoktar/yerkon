# A YERKON deployment option.
#
# Applied over defaults.toml with `--option rural-dense`. Only the
# figures that differ are listed; everything else stays as it is.

name = 'rural-dense'
title = 'Kırsal: 3 km ızgara, 30 m direk — %91,4, iki katı sermayeye'
origin = 'shipped'
note = """Forty-nine masts at three kilometres instead of thirty-three at four, each five metres taller: 91,43 % availability against the default's 89,50 %, for 6 516 151 TL against 3 154 228 TL.

Read that before buying it. It is 1,9 points for 3,4 million lira, or about 1,7 million a point — poor value, and it was not always. The note this replaces promised "the cheapest way past ninety percent" and was written when the default sat at 82,26 %. Sizing the rural round by how many anchors answer rather than by how many a fix needs took it to 89,50 % for no capital at all (ADR-0022), and most of what this option used to buy went with it.

It still beats rural-tall per point, because steel grows about as the square of height. The two are much closer than they were."""

[values]
'mounting.tall_mast.height_m' = 30.0
'mounting.tall_mast.site_cost_tl' = 122400.0
'rural.anchor_spacing_m' = 3000.0
'rural.anchor_stagger_m' = 1500.0
