# Bir YERKON yerleşim seçeneği. / A YERKON deployment option.
#
# `--option rural-tall` ile defaults.toml üzerine uygulanır; yalnızca
# farklı olan değerler listelenir.
#
# Applied over defaults.toml with `--option rural-tall`. Only the
# figures that differ are listed; everything else stays as it is.

name = 'rural-tall'
title = 'Kırsal: dağıtım direğinde 12 m, iletkenlere daha yakın'
title_en = 'Rural: 12 m on the distribution pole, closer to the conductors'
origin = 'shipped'
note = """Aynı kırk dokuz dağıtım direği, birim 10 yerine 12 metrede, aynı sermayeyle. Yükseklik menzili ve kullanılabilirliği artırıyor. Bedeli sahada: orta gerilim direkleri 12-14 m ve iki metre birimi iletkenlere yaklaştırıyor; bu dağıtım şirketinin iznine ve daha dikkatli bir montaja bağlı. Varsayılan bu yüzden 10 m."""
note_en = """The same forty nine distribution poles with the unit at 12 metres instead of 10, for the same capital. Height buys reach and availability. The cost is in the field: medium voltage poles are 12 to 14 m, and two metres bring the unit closer to the conductors, which rests on the distribution company's consent and a more careful fitting. That is why the default is 10 m."""

[values]
'mounting.distribution_pole.height_m' = 12.0
