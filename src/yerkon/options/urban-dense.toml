# Bir YERKON yerleşim seçeneği. / A YERKON deployment option.
#
# `--option urban-dense` ile defaults.toml üzerine uygulanır; yalnızca
# farklı olan değerler listelenir.
#
# Applied over defaults.toml with `--option urban-dense`. Only the
# figures that differ are listed; everything else stays as it is.

name = 'urban-dense'
title = 'Şehir içi: 300 m ızgara, daha sık aydınlatma direği'
title_en = 'Urban: a 300 m grid, anchors on more lighting columns'
origin = 'shipped'
note = """Aydınlatma direklerine 600 m yerine 300 m arayla birim. Bir şehirde yapılar zaten var; dolayısıyla bu, geometriyi bir sahanın bedeline değil modüllerin ve montajın bedeline satın alır. Tam çözünürlükteki taramada kullanılabilirlik artıyor, ama direk sayısı dört katına yakın ve maliyet onunla doğrusal artıyor, çünkü her direğin bedeli modül artı montaj."""
note_en = """Units on lighting columns 300 m apart instead of 600 m. A town has the structures already, so this buys geometry for the price of the modules and the fitting rather than the price of a site. In the full resolution sweep availability rises, but the anchor count nearly quadruples and the cost rises with it, because every anchor is a module plus a fitting."""

[values]
'urban.anchor_spacing_m' = 300.0
'urban.anchor_stagger_m' = 150.0
