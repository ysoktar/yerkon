name = 'rural-hard-ground'
title = 'Kırsal: Gölbaşı tepeleri, tasarlanmadığı arazide'
title_en = 'Rural: the Gölbaşı hills, terrain it was not designed for'
origin = 'shipped'
note = """Aynı yerleşim, Polatlı'nın 486 m'si yerine Gölbaşı'nın 907 m rölyefinin üzerinde. Bu bir öneri değil: tasarımın, tasarlanmadığı arazide neye mal olduğunu gösteriyor ve o sonucun aktarılması değil yeniden üretilebilmesi için burada duruyor.

Satırın sahasını değiştirir, yedek rölyef değerini değil: site.rural_relief_m yalnızca hiçbir zemin getirilmemişken okunur."""
note_en = """The same deployment on Gölbaşı's 907 m of relief instead of Polatlı's 486 m. This is not a proposal: it shows what the design costs in terrain it was not meant for, and it is here so that result can be reproduced rather than quoted.

It moves the row's site rather than the fallback relief figure: site.rural_relief_m is only read when no ground has been fetched."""

[values]
'rural.site' = 'golbasi'
