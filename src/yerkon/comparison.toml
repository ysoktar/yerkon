çözümü için en az dört gerekir; zamanlama hizmeti sürüyor."""
en = """The NavIC row is empty to reflect its current state. By the \
Indian government's statement of 29 July 2026 only three satellites \
providing position are working: IRNSS-1B, IRNSS-1I and NVS-01. An \
