[note.navic-accuracy]
sources = ["isro-accuracy", "isro-limits"]
tr = """NavIC için tarihsel olarak verilen 20 m altı değer 2σ kullanıcı \
konum doğruluğudur, P95 değildir; P95 sütunlarına yazılmadı."""
en = """The under 20 m historically given for NavIC is 2σ user position \
