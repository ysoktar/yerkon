[note.pozyx-figures]
sources = ["sensors-pozyx", "pozyx-install"]
tr = """Pozyx değerleri Sensors'ta yayımlanan konum hatası ölçümünden; \
alan ise 35000 m²'lik bir endüstriyel kurulumun bildirilen \
büyüklüğüdür."""
en = """The Pozyx figures come from a position error measurement \
published in Sensors, and the area is the reported size of a 35000 m² \
industrial installation."""
