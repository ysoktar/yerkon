# The comparison table's other systems, as their own sources publish them.
#
# Not this project's output. Every cell here is a published figure or a
# figure derived from one, and every derivation carries a note saying
# what was done to it. The YERKON rows are not in this file: they come
# from `published.toml`, which a run writes (ADR-0069).
#
# A cell can carry markers, written as ^key. The renderer numbers them
# in the order they first appear, so adding a note never renumbers the
# file by hand.
#
# Cells are text rather than numbers because most of them are bounds,
# pairs or absences: "≤ 8", "≥ %99 / ≥ %90", "-". Making them numbers
# would mean throwing that away.

#: The note on the availability column itself.
availability_note = "availability-warning"

[yerkon]
# Markers for the rows that come from the run, by scenario key.
urban = "urban-run"
rural = "rural-run"
tunnel = "tunnel-run"
availability = "yerkon-availability"
capex = "yerkon-capex"
# The tunnel row is priced by its length, so its two cost cells carry a
# note of their own saying so (ADR-0073).
by_route = "tunnel-per-km"

[[row]]
system = "GPS"
technology = "GNSS"
environment = "Dış"
cells = ["-^gnss-p50", "≤ 8 / ≤ 15^gps-performance", "≤ 13 / ≤ 33",
         "≥ %99 / ≥ %90", "≈ 148940000^land-area",
         "≈ 2341,76^gps-capex", "≈ 130,10^gps-opex"]

[[row]]
system = "Galileo OS"
technology = "GNSS"
environment = "Dış"
cells = ["-", "≤ 1,41^galileo-performance", "≤ 2,40",
         "≥ %99,58^galileo-availability", "≈ 148940000",
         "≈ 2109,23^galileo-capex", "≈ 223,01^galileo-opex"]

[[row]]
system = "GLONASS"
technology = "GNSS"
environment = "Dış"
cells = ["-", "≤ 5 / ≤ 12^glonass-pair", "≤ 9 / ≤ 25^glonass-pair",
         "≥ %99 / ≥ %90^glonass-pair", "≈ 148940000",
         "-^glonass-capex", "≈ 61,10^glonass-opex"]

[[row]]
system = "BeiDou BDS"
technology = "GNSS"
environment = "Dış"
cells = ["-", "≈ 1,52^beidou-accuracy", "≈ 2,64^beidou-accuracy",
         "> %95^beidou-availability", "≈ 148940000",
         "≥ 2714,05^beidou-capex", "-^beidou-opex"]

[[row]]
system = "QZSS SLAS"
technology = "Bölgesel GNSS düzeltme servisi"
environment = "Dış"
cells = ["-", "≤ 1,70^qzss-accuracy", "≤ 2,73^qzss-accuracy",
         "%99,996^qzss-availability", "≈ 377974,87^qzss-area",
         "-^qzss-capex", "≤ 10904,49^qzss-opex"]

[[row]]
system = "NavIC SPS"
technology = "Bölgesel GNSS"
environment = "Dış"
cells = ["-", "-^navic-status", "-^navic-accuracy", "-", "-^navic-area",
         "-^navic-capex", "-"]

[[row]]
system = "TerraPoiNT"
technology = "Karasal konumlandırma, UHF"
environment = "İç + dış"
cells = ["≤ 3^terrapoint-accuracy", "≤ 8^terrapoint-accuracy",
         "2^terrapoint-vertical", "%99,96^terrapoint-vertical",
         "≈ 900^terrapoint-area", "-^terrapoint-capex", "-"]

[[row]]
system = "Locata"
technology = "Karasal pseudolite konumlandırma"
environment = "İç + dış"
cells = ["-", "0,017^locata-figures", "0,024^locata-figures",
         "%100^locata-availability", "≈ 6475^locata-area",
         "-^locata-capex", "-"]

[[row]]
system = "Pozyx"
technology = "UWB RTLS"
environment = "İç + dış"
cells = ["0,114^pozyx-figures", "0,181^pozyx-figures", "-",
         "-^pozyx-availability", "≥ 0,035^pozyx-area",
         "-^pozyx-capex", "-"]

[[row]]
system = "eLoran"
technology = "Karasal düşük frekanslı konumlandırma"
environment = "Dış"
cells = ["-", "15,72^eloran-accuracy", "-^eloran-vertical",
         "-^eloran-availability", "-^eloran-area",
         "-^eloran-capex", "-"]

# --- The notes ------------------------------------------------------------
#
# Each one says what was done to a published figure to get the cell
# beside it. Where a source publishes nothing the cell is empty and the
# note says why, rather than a proxy standing in silently.

[note.availability-warning]
# A definition rather than a claim: it says what the column means, not
# what anybody measured.
defines = true
sources = []
tr = """Kullanılabilirlik, tanımlanan doğruluk ve hizmet koşullarını \
karşılayan geçerli bir konum çözümünün sunulabildiği zaman veya \
durumların oranıdır. Farklı kaynaklar farklı test süreleri, bölgeler ve \
performans eşikleri kullandığı için bu yüzdeler aynı test protokolünün \
sonucu gibi karşılaştırılmamalıdır."""
en = """Availability is the share of time or of situations in which a \
valid position solution meeting the stated accuracy and service \
conditions can be provided. The sources use different test durations, \
regions and performance thresholds, so these percentages must not be \
compared as though they came from one protocol."""

[note.gnss-p50]
sources = ["gps-gov", "gsc-galileo-q2"]
tr = """GPS, Galileo, GLONASS ve BeiDou için aynı yöntemle ölçülmüş, \
güncel ve karşılaştırılabilir bir P50 kullanıcı konum hatası \
yayımlanmıyor. P95'ten P50 türetilmedi."""
en = """No current, comparable P50 user position error measured the same \
way is published for GPS, Galileo, GLONASS or BeiDou. No P50 was \
derived from a P95."""

[note.land-area]
sources = ["cia-land"]
tr = """Küresel uydu sistemlerinde alan paydası olarak okyanuslar ve \
denizler çıkarılmış Dünya kara yüzeyi, yaklaşık 148940000 km² \
kullanıldı. GPS, Galileo, GLONASS ve BeiDou denizde de hizmet verir; \
bu seçim hizmet alanını karayla sınırlamıyor, yalnızca karada kurulan \
YERKON ve diğer karasal sistemlerle aynı paydada karşılaştırmayı \
sağlıyor. Karada GNSS'nin kesin kullanılamadığı tek bir alan da \
çıkarılamaz: tüneller, yer altı yapıları, bina içleri, derin şehir \
kanyonları, dağ gölgeleri, sık bitki örtüsü, çok yollu yayılım ve yerel \
parazit çözümü bozar, ama bunlar alıcıya, antene, uydu geometrisine ve \
zamana bağlıdır. Önceki sürümlerde payda Dünya'nın bütün yüzeyiydi \
(510064472 km²)."""
en = """For the global satellite systems the area denominator is the \
earth's land surface with the oceans and seas taken out, about \
148940000 km². GPS, Galileo, GLONASS and BeiDou serve the sea as well; \
the choice does not limit their service to land, it only puts them on \
the same denominator as YERKON and the other terrestrial systems, which \
are built on land. Nor can a single area where GNSS certainly fails on \
land be subtracted: tunnels, underground structures, the inside of \
buildings, deep street canyons, terrain shadow, dense vegetation, \
multipath and local interference all degrade the solution, but how much \
depends on the receiver, the antenna, the satellite geometry and the \
time. Earlier versions divided by the earth's whole surface \
(510064472 km²)."""

[note.gps-performance]
sources = ["gps-gov", "gps-standards"]
tr = """GPS değerleri 2024 GPS SPS performans analiziyle yeniden kontrol \
edildi. İlk sayı küresel ortalama, ikinci sayı en kötü konumdur: %95 \
yatay hata 8 m ve 15 m, dikey 13 m ve 33 m altında; kullanılabilirlik \
ortalama konumda %99, en kötü konumda %90 üstünde. 2024 analizinde L1 \
C/A performans taahhütleri karşılandı."""
en = """The GPS figures were checked again against the 2024 GPS SPS \
performance analysis. The first figure is the global average and the \
second the worst location: 95 % horizontal error under 8 m and 15 m, \
vertical under 13 m and 33 m, availability over 99 % at the average \
location and over 90 % at the worst. The 2024 analysis found the L1 \
C/A commitments met."""

[note.gps-capex]
sources = ["gps-investment", "banque-de-france"]
tr = """GPS CAPEX değeri 7,2 milyar USD tedarik ile araştırma geliştirme \
toplamından türetilmiş tarihsel bir yatırım vekilidir; bugünkü yeniden \
kurulum maliyeti ya da muhasebe CAPEX'i değildir. 4 Eylül 2026 kuruyla \
TL'ye çevrilip kara paydasına bölündü; Dünya'nın bütün yüzeyine \
bölündüğünde 683,80 TL/km² idi."""
en = """The GPS CAPEX figure is a historical investment proxy derived \
from 7,2 billion USD of procurement plus research and development. It \
is neither today's cost of building it again nor an accounting CAPEX. It \
was converted to lira at the 4 September 2026 rate and divided by the \
land denominator; over the earth's whole surface it was 683,80 TL/km²."""

[note.gps-opex]
sources = ["gps-sustain", "banque-de-france"]
tr = """GPS OPEX değeri 1993 DOD/DOT ortak çalışma grubunun, asgari GPS \
hizmetini sürdürmek için FY1993 dolarıyla yılda yaklaşık 400 milyon USD \
tahminidir. Enflasyon düzeltmesi yapılmadı. Bütün yüzeye bölündüğünde \
37,99 TL/km²/yıl idi."""
en = """The GPS OPEX figure is the 1993 DOD/DOT joint task force's \
estimate of sustaining a minimum GPS service, about 400 million USD a \
year in FY1993 dollars. No inflation adjustment was applied. Over the \
earth's whole surface it was 37,99 TL/km²/yr."""

[note.galileo-performance]
sources = ["gsc-galileo-q2", "gsc-galileo"]
tr = """Galileo'nun önceki 7,5 m ve 15 m değerleri ölçülmüş hata değil, \
konum kullanılabilirliği hesabında kullanılan hata koşullarıydı. Yerine \
Q2 2026 Açık Servis raporunun tamamlayıcı ölçümü kondu: yalnız Galileo, \
çift frekans, 3B; yayılım ve kullanıcı ekipmanı hataları dahil çeyrek \
boyunca %95 yatay hata 1,41 m, dikey 2,40 m. Bu ölçüm bir asgari \
performans taahhüdü değildir. Sistemin kendi katkısı için ayrıca \
taahhüt edilen sınırlar çift frekansta yatay 5 m ve dikey 8 m, tek \
frekansta 10 m ve 16 m; gerçekleşen değerler bunların belirgin biçimde \
altında."""
en = """Galileo's earlier 7,5 m and 15 m were not measured errors but the \
error conditions of the positioning availability assessment. They were \
replaced by the complementary measurement in the Q2 2026 Open Service \
report: Galileo only, dual frequency, 3D, including propagation and user \
equipment error, 95 % horizontal error 1,41 m and vertical 2,40 m over \
the quarter. That measurement is not a minimum performance commitment. \
The limits committed for the system's own contribution are 5 m \
horizontal and 8 m vertical on dual frequency and 10 m and 16 m on \
single frequency; the achieved values are well inside them."""

[note.galileo-availability]
sources = ["gsc-galileo-q2"]
tr = """Q2 2026'da Galileo konum kullanılabilirliği Nisan'da en kötü \
kullanıcı konumunda %99,58, ortalama konumda %99,98; Mayıs ve Haziran'da \
ikisi de %100. Hücrede çeyreğin en düşük sonucu var. Resmî asgari \
hedefler en kötü konumda %87, ortalama konumda %90; hesap yatayda \
7,5 m, dikeyde 15 m koşuluyla yapılır."""
en = """In Q2 2026 Galileo's positioning availability was 99,58 % at the \
worst user location in April and 99,98 % at the average one; both were \
100 % in May and June. The cell holds the lowest result of the quarter. \
The official minimum targets are 87 % at the worst location and 90 % at \
the average one, assessed against 7,5 m horizontal and 15 m vertical."""

[note.galileo-capex]
sources = ["eca-galileo", "banque-de-france"]
tr = """Galileo CAPEX değeri 5,58 milyar EUR'luk tarihsel program \
uygulama maliyetinden türetilmiş yatırım vekilidir; geliştirme ve \
konuşlandırmayı içerir. Bütün yüzeye bölündüğünde 615,90 TL/km² idi."""
en = """The Galileo CAPEX figure is an investment proxy derived from the \
5,58 billion EUR historical programme implementation cost, which covers \
development and deployment. Over the earth's whole surface it was \
615,90 TL/km²."""

[note.galileo-opex]
sources = ["ec-galileo", "banque-de-france"]
tr = """Avrupa Komisyonu'nun 2011 maliyet tablosu, 2010 fiyatlarıyla \
yıllık ortalama tam altyapı işletme maliyetini 800 milyon EUR verir: \
590 milyonu Galileo, 110 milyonu EGNOS, 100 milyonu diğer kalemler. \
Yalnız Galileo'nun 590 milyonu kullanıldı. Bu 2010 fiyatlı tarihsel bir \
tahmindir, 2026'da gerçekleşen harcama değildir. Bütün yüzeye \
bölündüğünde 65,12 TL/km²/yıl idi."""
en = """The European Commission's 2011 cost table gives the average \
yearly cost of operating the full infrastructure, in 2010 prices, as \
800 million EUR: 590 million for Galileo, 110 million for EGNOS and 100 \
million for other items. Only Galileo's 590 million was used. It is a \
historical estimate in 2010 prices, not what was spent in 2026. Over the \
earth's whole surface it was 65,12 TL/km²/yr."""

[note.glonass-pair]
sources = ["icao-annex", "gost-glonass"]
tr = """GLONASS'ta ilk sayı ortalama, ikinci sayı en kötü konum \
performansıdır. Aynı tanımla ve aynı istatistikle yayımlanmış daha yeni \
bir küresel ölçüm bulunamadığı için standardın değerleri tutuldu."""
en = """For GLONASS the first figure is the average and the second the \
worst location performance. No newer global measurement published with \
the same definition and statistic was found, so the standard's figures \
were kept."""

[note.glonass-capex]
sources = ["kommersant-build"]
tr = """GLONASS CAPEX boş bırakıldı. Kamuya açık tarihsel program \
tutarları geliştirmeyi, kullanımı ve sürdürmeyi saf kurulum \
yatırımından güvenilir biçimde ayırmıyor."""
en = """The GLONASS CAPEX cell is left empty. The public historical \
programme figures do not reliably separate development, use and \
sustainment from pure deployment investment."""

[note.glonass-opex]
sources = ["kommersant-run", "kommersant-items", "banque-de-france"]
tr = """GLONASS OPEX değeri 2012-2020 dönemindeki 146898,9 milyon RUB \
sistem sürdürme bütçesinin dokuz yıllık basit ortalamasına dayanan \
tarihsel bir vekildir. Bütün yüzeye bölündüğünde 17,84 TL/km²/yıl \
idi."""
en = """The GLONASS OPEX figure is a historical proxy: the simple nine \
year average of the 146898,9 million RUB system sustainment budget for \
2012 to 2020. Over the earth's whole surface it was 17,84 TL/km²/yr."""

[note.beidou-accuracy]
sources = ["beidou-igmas", "beidou-standard"]
tr = """BeiDou hücrelerinde resmî gerçekleşen performans var: Çin Uydu \
Navigasyon Ofisi'nin iGMAS değerlendirmesine göre B1C tek frekansta \
küresel %95 yatay doğruluk yaklaşık 1,52 m, dikey yaklaşık 2,64 m. \
Önceki değerler hizmet standardınındı: küreselde yatay ve dikey 10 m, \
Asya-Pasifik'te 5 m."""
en = """The BeiDou cells hold official achieved performance: by the China \
Satellite Navigation Office's iGMAS assessment, B1C single frequency \
global 95 % horizontal accuracy is about 1,52 m and vertical about \
2,64 m. The earlier figures were the service standard's: 10 m horizontal \
and vertical globally, 5 m in Asia Pacific."""

[note.beidou-availability]
sources = ["beidou-standard", "beidou-igmas"]
tr = """BeiDou Açık Servis Performans Standardı 2.0 sistem hizmet \
kullanılabilirliğini %95'in üstünde tanımlar. Aynı kaynağın 0,99 üstü \
dediği değer uydu kullanılabilirliğidir; konum hizmeti \
kullanılabilirliğiyle aynı ölçü olmadığı için hücreye yazılmadı."""
en = """The BeiDou Open Service Performance Standard 2.0 defines system \
service availability as over 95 %. The figure the same source puts over \
0,99 is satellite availability; it is not the same measure as \
positioning service availability, so it was not put in the cell."""

[note.beidou-capex]
sources = ["casi-beidou", "banque-de-france"]
tr = """BeiDou CAPEX değeri, CASI'nin aktardığı en düşük tarihsel \
program tahmini olan 56 milyar CNY'yi alt sınır kabul eden bir \
vekildir; saf muhasebe CAPEX'i değildir. Bütün yüzeye bölündüğünde \
792,51 TL/km² idi."""
en = """The BeiDou CAPEX figure is a proxy that takes the lowest \
historical programme estimate CASI reports, 56 billion CNY, as a lower \
bound. It is not an accounting CAPEX. Over the earth's whole surface it \
was 792,51 TL/km²."""

[note.beidou-opex]
sources = ["casi-beidou"]
tr = """BDS-3 küresel takımyıldızının ve ana yer segmentinin güncel \
yıllık işletme toplamı bulunamadı. Bölgesel CORS işletme ihaleleri bu \
amaçla kullanılmadı."""
en = """No current yearly operating total for the BDS-3 global \
constellation and its main ground segment was found. Regional CORS \
operating tenders were not used as a stand-in."""

[note.qzss-accuracy]
sources = ["qzss-report"]
tr = """QZSS SLAS değerleri artık hizmet tasarım sınırları değil, \
FY2025 ikinci yarı performans raporunun aylık %95 sonuçlarıdır: 13 \
değerlendirme noktasında Ekim 2025-Mart 2026 arasında yayımlanan en \
yüksek yatay P95 1,70 m (Itoman), en yüksek dikey P95 2,73 m \
(Hiroshima). İkisi aynı anda oluşmuş bir 3B hata çifti değildir."""
en = """The QZSS SLAS figures are no longer service design limits but \
the monthly 95 % results in the FY2025 second half performance report: \
over 13 evaluation points from October 2025 to March 2026, the highest \
published horizontal P95 is 1,70 m (Itoman) and the highest vertical \
P95 2,73 m (Hiroshima). They are not one 3D error pair that occurred \
together."""

[note.qzss-availability]
sources = ["qzss-report"]
tr = """FY2025 ikinci yarıda ölçülen takımyıldızı hizmet \
kullanılabilirliği 0,99996. Resmî asgari şartname 0,9997."""
en = """The constellation service availability measured in the FY2025 \
second half is 0,99996. The official minimum specification is 0,9997."""

[note.qzss-area]
sources = ["qzss-report", "gsi-japan"]
tr = """SLAS hizmet alanı yarıçapı 100-350 km olan 13 daireden oluşur, \
ama dairelerin birleşik alanı km² olarak yayımlanmaz ve önemli bir kısmı \
denizdir. Karayla karşılaştırma için Japonya'nın 1 Nisan 2026 tarihli \
377974,87 km² ulusal alanı açık bir vekil olarak kullanıldı; gerçek \
SLAS hizmet alanı değildir."""
en = """The SLAS service area is 13 circles of 100 to 350 km radius, but \
their combined area is not published in km² and much of it is sea. For \
a land comparison Japan's national area of 1 April 2026, 377974,87 km², \
is used as an open proxy. It is not the real SLAS service area."""

[note.qzss-opex]
sources = ["cao-budget", "cao-archive", "banque-de-france"]
tr = """13,294 milyar JPY/yıl, FY2026'da QZSS hizmet sunumuna ayrılan \
bütçenin tamamıdır, yalnız SLAS değildir. Japonya kara vekiline \
bölündü; bu yüzden bir üst sınırdır ve "≤" ile yazıldı."""
en = """13,294 billion JPY a year is the whole FY2026 budget for providing \
the QZSS service, not SLAS alone. It was divided by the Japanese land \
proxy, so it is an upper bound and is written with "≤"."""

[note.qzss-capex]
sources = ["cao-cost"]
tr = """Uydular, yer sistemi, fırlatma, geliştirme ve uzun süreli hizmet \
sözleşmeleri içinden yalnız SLAS'a düşen kurulum payı kamuya açık \
veriden ayrıştırılamadı."""
en = """The share of satellites, ground system, launch, development and \
