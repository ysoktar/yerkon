[note.terrapoint-accuracy]
sources = ["ion-terrapoint"]
tr = """TerraPoiNT'in yatay P50 ve P95 değerleri ION GNSS+ 2021'de \
yayımlanan aynı 2B navigasyon testinden. Daha önce aynı hücreye başka \
testlerden gelen 9-14 m gibi değerler karışmıştı; çıkarıldı."""
en = """TerraPoiNT's horizontal P50 and P95 come from one 2D navigation \
test published at ION GNSS+ 2021. Figures from other tests, around 9 to \
14 m, had been mixed into the same cell and were removed."""

[note.terrapoint-vertical]
sources = ["jrc-nextnav"]
tr = """Dikey 2 m ve %99,96 kullanılabilirlik JRC'nin alternatif \
konumlandırma değerlendirmesinden; ION yatay testiyle aynı deney \
değildir. Kullanılabilirlik JRC'nin varsayımları altındadır, ticari bir \
