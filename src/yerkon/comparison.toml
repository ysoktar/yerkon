[note.tunnel-per-km]
# A definition rather than a claim: it says what the cell is divided
# by, and no source outside this project could supply that.
defines = true
sources = []
tr = """Tünel satırının iki maliyet hücresi kilometrekareye değil \
güzergâh kilometresine bölünmüştür, ve "/km" ile işaretlidir. 12 m \
genişliğinde 2 km'lik bir tünel bir kilometrekarenin ellide biri kadar \
yer kaplar; bu kadar küçük bir alana bölmek sayıyı tünel pahalı olduğu \
için değil, payda küçük olduğu için büyütüyordu. Tünel bir alana değil \
bir hatta hizmet eder, ve bir tünel işletmecisinin soracağı sayı da \
kilometre başına olandır. Diğer iki satır alana bölünmeye devam ediyor \
ve bu yüzden bu hücre onlarla aynı ölçü değildir."""
en = """The tunnel row's two cost cells are divided by route kilometre \
rather than by square kilometre, and are marked "/km". A 2 km tunnel \
12 m wide covers a fiftieth of a square kilometre; dividing by \
something that small made the number large because the denominator was \
small, not because a tunnel is dear. A tunnel serves a line rather \
than an area, and cost per kilometre is the figure a tunnel operator \
would ask for. The other two rows are still divided by area, so this \
cell is not the same measure as theirs."""

[note.yerkon-capex]
sources = ["digikey", "lcsc", "mouser", "banque-de-france"]
tr = """YERKON CAPEX, senaryo başına yayın birimi sayısının 100 adetlik \
malzeme listesi birim fiyatıyla çarpılıp senaryo alanına bölünmesiyle \
hesaplanır. Değer yalnız ana donanım bileşenlerini kapsar: PCB ve \
dizgi, pasifler, kablolama, mekanik işleme, test, kalibrasyon, \
sertifikasyon, vergi, kargo, saha kurulumu, işçilik ve altyapı işleri \
dahil değildir. Konum sonuçları radyo menzil ölçümüne dayalı serbest 3B \
tek epoch çözümlerdir; atalet ölçüm birimi, odometri, harita kısıtı ve \
Kalman filtresi kullanılmamıştır."""
en = """YERKON CAPEX is the number of broadcast units in a scenario \
times the unit price from the hundred unit bill of materials, divided by \
the scenario's area. It covers the main hardware only: board and \
assembly, the passives, cabling, machining, test, calibration, \
certification, tax, shipping, installation, labour and infrastructure \
work are all excluded. The position results are free 3D single epoch \
solutions from radio ranging, with no inertial unit, odometry, map \
constraint or Kalman filter."""
