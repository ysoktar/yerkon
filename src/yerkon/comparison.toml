sea. It was removed for a land comparison."""

[note.navic-capex]
sources = ["navic-cost", "navic-scope"]
tr = """Tarihsel 1420 crore INR bütçe yedi yörünge uydusunu, iki yer \
yedeğini ve yer segmentini kapsar, fırlatmayı dışarıda bırakır. Güncel \
