[note.navic-area]
sources = ["isro-limits"]
tr = """Önceki 33243459 km², ISRO'nun yaklaşık enlem ve boylam \
sınırlarından hesaplanmış, geniş deniz alanları içeren bir \
dikdörtgendi; kara karşılaştırması için kaldırıldı."""
en = """The earlier 33243459 km² was a rectangle computed from ISRO's \
