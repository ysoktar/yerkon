# Malzeme listesi, parça parça. / The bill of materials, part by part.
#
# Her parça satıcısının kendi kademe tablosuyla yazılı: `ladder` her
# satırda bir en küçük adet ve o adetten başlayan birim fiyat (USD). Bir
# ürünün 1, 100 ve 1000 adetlik fiyatı, her parçanın o kadar kart için
# alınan adetteki kademesinden toplanıyor. Kademesi yayımlanmamış bir
# adette indirim varsayılmıyor: bilinen son kademe kullanılıyor.
#
# Every part carries its seller's own price ladder: each `ladder` row is
# a least quantity and the unit price (USD) from it. A product's price at
# 1, 100 and 1000 is the sum of each part at the tier that many boards
# buy. Where no tier is published, no discount is assumed: the last known
# tier holds (ADR-0105).

#: TL per USD: the central bank's indicative forex selling rate of
#: 29 September 2026, the one date every lira figure is converted at.
#: Euro prices go to dollars at the same bulletin's cross rate, 1,1349.
usd_try = 49.0013
usd_try_source = "TCMB gösterge niteliğindeki kurlar, 29.09.2026 (bülten 2026/183): USD döviz satış 49,0013 TL; EUR/USD çapraz kur 1,1349"

#: Which tier the table prices a deployment at. A thousand, because the
#: operating model already splits the central system across a thousand
#: anchors (`operating.central_operation_tl_per_anchor_year`).
used_tier = 1000

