# The SX1281 has no ranging engine (Semtech SX1280/SX1281 Data Sheet Rev
# 3.2, table 1-1, p. 15). EBYTE's own pages name the chip in the E28
# modules both SX1280 and SX1281: the E28-2G4M12S and E28-2G4M20S user
# manuals say SX1280, the product pages say SX1281 while listing ranging
# among the features. Order against the chip, not the module name: the
# package reads 1280 or 1281 (datasheet figure 17-2), and a module that
# cannot range is no use here.
