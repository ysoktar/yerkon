# Malzeme listesi, parça parça. / The bill of materials, part by part.
#
# Raporun 14. sayfası her ürün için iki toplam veriyor: 1 adet ve 100
# adette birim fiyat. Parça fiyatlarını vermiyor. Burada her ana parça
# kendi satıcı fiyatıyla yazılı; raporun toplamından bu parçalar
# çıkarılınca kalan "diğer" kalemi (güç dönüşümü, koruma, bağlantı,
# kutu) ayrıca yazılı. Üç yayın biriminde de bu kalan 1 adette 15 USD
# civarında çıkıyor, yani döküm raporla tutarlı.
#
# The report gives two totals per product and no part prices. Here each
# main part carries its own distributor price, and what is left of the
# report's total once they are taken out is written down as "other".
# It comes to about 15 USD at one unit for all three broadcast units,
# which is what says the breakdown agrees with the report (ADR-0079).
#
# Fiyatlar 23 Eylül 2026'da web aramasının döndürdüğü satıcı
# fiyatlarıdır. Bu oturumun ağ politikası satıcı sitelerini açmaya izin
# vermediği için sayfalar tek tek açılıp kademe kademe doğrulanamadı.
# The prices are the distributor prices a web search returned on 23
# September 2026. The session's network policy did not allow opening
# the distributor pages, so no price tier was read off a page directly.

#: TL per USD on 4 September 2026, the date the report converted at. The
#: report did not print its rate; this is the free market rate that
#: morning, which the central bank's reference sits within a few kuruş
#: of.
usd_try = 48.44
usd_try_source = "USD/TRY 4 Eylül 2026, serbest piyasa 09:30 satış 48,4445 (BloombergHT)"

#: The 1000 unit price over the 100 unit price, for whatever has no
#: verified volume price: the "other" line and parts whose distributor
#: tier could not be read. A part with a `volume` table is priced at the
#: thousand from that table instead (ADR-0093). The report's own 100
#: over 1 is 0,69 to 0,80 per line.
thousand_over_hundred = 0.90

#: Which tier the table prices a deployment at. A thousand, because the
#: operating model already shares the central system across a thousand
#: anchors (`operating.anchors_sharing_central_operation`); pricing the
#: hardware at a hundred while running it as one of a thousand was two
#: network sizes in one row.
used_tier = 1000

