# çarptığını söyler. Bunlar onu yerden yere, iki ya da üç ölçekte ve
# konuma göre belirlenimli olarak değiştirir — bir yama, ortalamayla
# kaybolan bir çekiliş olarak değil, orası hakkında bir olgu olarak
# pürüzlüdür (ADR-0026).

[values."urban.ground_patch_m"]
value = 200.0
