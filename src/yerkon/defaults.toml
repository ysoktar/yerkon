source = """Dicle Elektrik, Diyarbakır Suriçi, 25 Haziran 2026: 11 ekip ve 11 sepetli araç bir hafta sonunda 207 direkteki 414 armatürü değiştirdi"""
source_en = """Dicle Elektrik, Diyarbakır Suriçi, 25 June 2026: 11 crews with 11 bucket trucks replaced 414 luminaires on 207 poles over one weekend"""
note = """Kırsalda bir ekibin günde ziyaret ettiği dağıtım direği sayısıdır. \
Şehir içinde direk başına bir saatlik iş kabul edilmektedir \
(aydınlatma direğinde günde ziyaret edilen birim, Dicle Elektrik \
örneği). Kırsalda buna yol süresi eklenmektedir: sekiz saatlik iş \
gününün iki saati merkeze gidiş dönüşe, sahalar arasındaki her geçiş \
ise yarım saate karşılık gelmektedir (YERKON'un yol tahmini). (8 - 2) \
/ (1 + 0,5) = 4."""
note_en = """How many distribution poles a crew reaches in a day in open country. Town counts an hour of work a column (columns a crew reaches in a day, the Dicle Elektrik example). Open country adds the road: two hours of the eight-hour day to and from the base, half an hour between sites (YERKON's estimate of the road). (8 - 2) / (1 + 0,5) = 4."""
affects = "bu yapıdaki birimlerin montaj ve bakım bedelini"
affects_en = "the fitting and maintenance cost of units on this structure"

[values."mounting.distribution_pole.rent_tl_per_year"]
value = 0.0
unit = "TL/year"
provenance = "DESIGN"
source = "YERKON tasarım tercihi: kamu protokolü"
source_en = "YERKON design choice: a public-sector agreement"
note = """Dağıtım şirketinin direğinde yayın birimi bulundurmanın yıllık bedeli \
sıfır kabul edilmiştir. Yayın birimlerinin kamu protokolüyle kurulması \
ve AUS kabinleri, yol kenarı üniteleri ve dağıtım direkleri gibi \
mevcut kamu yapılarına dahil edilebilmesi öngörülmektedir. Dağıtım \
şirketlerinin direğe yerleştirilen cihazlar için yayımladığı bir bedel \
de bulunmamaktadır: Ulaştırma Bakanlığı'nın geçiş hakkı usul ve \
esasları, Türk Telekom'un bağlantı ve nakil ücretleri ve Genel \
Aydınlatma Yönetmeliği direk başına bir bedel öngörmemektedir. \
Karşılaştırma için ticari kullanıcılara uygulanan bedeller: dağıtım \
şirketleri 2015'ten bu yana EPDK izniyle direklerde reklam alanı \
kiralamaktadır ve en küçük afiş için aylık bedel 4700 TL'dir (Tr724, \
11 Mayıs 2019); İstanbul Büyükşehir Belediyesi'nin 2025 tarifesi, \
belediye mülküne yerleştirilen bir tekrarlayıcı (repeater) veya küçük \
hücre (small cell) için yıllık 24500 TL'dir; BEDAŞ ve AYEDAŞ ise \
aydınlatma direğindeki bir kabinet için yer seçim belgesi ücretinin \
iki katını almaktadır. Protokol yapılamaması durumunda direk başına \
yıllık 1200 TL'lik bir bedel kırsal OPEX'i yaklaşık yarı yarıya \
artıracaktır."""
note_en = """What the distribution company charges a year to carry a unit on its pole: nothing. The units go up under a public-sector agreement, with the prospect of being included in public structures that already stand, such as ITS cabinets, roadside units and distribution poles. Nor has any distribution company published a fee for equipment on its poles: the transport ministry's rights-of-way rules, Türk Telekom's connection fees and the General Lighting Regulation name no per-pole fee. Fees charged to commercial users, for comparison: distribution companies have rented advertising space on their poles since 2015 with the regulator's leave, the smallest poster 4700 TL a month (Tr724, 11 May 2019); Istanbul Metropolitan Municipality's 2025 tariff charges 24500 TL a year for a repeater or small cell on its property, and twice the site selection fee for a cabinet on a BEDAŞ or AYEDAŞ lighting column. Without the agreement, 1200 TL a pole a year would raise rural OPEX by about half."""
affects = "dağıtım direğindeki direklerin OPEX'ini"
affects_en = "OPEX of units on distribution poles"
sensitivity = "direk başına yıllık 1200 TL kırsal OPEX'i yaklaşık %47 artırır"
sensitivity_en = "1200 TL a pole a year raises rural OPEX by about 47 %"

