[values."mounting.tall_mast.site_cost_tl"]
value = 191890.0
unit = "TL"
provenance = "DERIVED"
source = """Pana Bayrak Direği (Ankara), Eylül 2026 liste fiyatları: 20 m galvaniz direk 120000 TL, 30 m galvaniz direk 475000 TL; TEDAŞ tipi galvaniz poligon direk 6 m 6500, 8 m 9750, 10 m 14750, 12 m 18250, 14 m 24750, 15 m 27500 TL"""
source_en = """Pana Bayrak Direği (Ankara), September 2026 list prices: a 20 m galvanised pole 120000 TL, a 30 m galvanised pole 475000 TL; TEDAŞ-type galvanised polygonal columns 6 m 6500, 8 m 9750, 10 m 14750, 12 m 18250, 14 m 24750, 15 m 27500 TL"""
note = """Yirmi beş metrelik bir direk ve montajı. 25 m için yayımlanmış fiyat yok; 20 m direğin fiyatı, modelin direk kuralıyla (bedel yüksekliğin karesiyle artar) 25 m'ye taşındı: 120000 x (25 / 20)² = 187500 TL. 30 m'nin fiyatı bu kuraldan da hızlı artıyor (475000 TL), yani bu değer düşük tarafta. Montaj bir ekip gününün dörtte biri, 4392 TL: toplam 191892, yuvarlanarak 191890 TL. Temel ve vinç ayrıca fiyatlanmadı."""
note_en = """A twenty-five metre mast and its fitting. No price is published for 25 m; the 20 m pole's price is carried to 25 m by the model's mast rule (cost grows with the square of height): 120000 x (25 / 20)² = 187500 TL. The 30 m price rises faster than that rule (475000 TL), so this value errs low. Fitting is a quarter of a crew day, 4392 TL: 191892, rounded to 191890 TL. The foundation and crane are not priced apart."""
affects = "dikilen direkteki her birimin CAPEX'ini"
affects_en = "CAPEX of every unit on a raised mast"

