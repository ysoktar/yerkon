[values."operating.anchor_kwh_per_year"]
value = 3.0
unit = "kWh/year"
provenance = "DERIVED"
source = "SX1280 ve STM32G0 veri sayfaları, YERKON hesabı"
source_en = "SX1280 and STM32G0 datasheets, YERKON's arithmetic"
note = """Bir yayın biriminin yıllık tüketimi. Birim zamanının neredeyse \
tamamında dinliyor: SX1280 dinlerken birkaç mA, mikrodenetleyici bir iki \
mA çeker, 3,3 V'ta ikisi 30 mW'ı bulmaz. Şebeke dönüştürücüsünün boştaki \
kaybı ve yanıt yayınları eklenince ortalama 0,34 W'ı geçmiyor: yılda 3 \
kWh. Bu cömert bir üst sınır."""
note_en = """One broadcast unit's yearly consumption. The unit spends \
nearly all its time listening: the SX1280 draws a few mA doing that and \
the microcontroller one or two, under 30 mW together at 3,3 V. With the \
mains converter's idle loss and the replies it sends, the average stays \
under 0,34 W, which is 3 kWh a year. That is a generous upper bound."""
affects = """şebekeli direklerin enerji kalemini ve şebeke dışı beslemenin \
boyutunu"""
affects_en = """the energy line of mains-fed anchors and the size of an \
off-grid supply"""
sensitivity = "enerji kalemi her satırda OPEX'in %2'sinden az"
sensitivity_en = "the energy line is under 2 % of OPEX in every row"

[values."operating.connectivity_tl_per_year"]
value = 0.0
unit = "TL/year"
provenance = "DESIGN"
source = "YERKON tasarım tercihi"
source_en = "YERKON design choice"
note = """Kendi hattı olmayan bir birimin yıllık veri bedeli: sıfır, çünkü \
birimlere SIM kartı konmuyor. Hattı olan yapıdaki birim merkeze o hattan \
bağlanıyor: tünelde tünelin haberleşme omurgası, şehirde ışıklı kavşağın \
sinyal dolabı, kırsalda yol üzerindeki AUS noktası. Hattı olmayan birim \
mesajlarını kendi telsiziyle hattı olan en yakın birime iletiyor. Her \
birim merkeze düzenli aralıklarla kısa bir "çalışıyorum" mesajı (yaşam \
sinyali) gönderiyor; mesajı gelmeyen birim arızalı sayılıyor. Alıcılar \
GPS karıştırması ya da aldatması gördüğünde bunu yakındaki yayın birimine \
iletiyor, uyarı da aynı yoldan merkeze ulaşıyor."""
note_en = """What a year of data costs an anchor with no line of its own: \
nothing, because no unit carries a SIM card. A unit on a structure with a \
line reaches the centre over it: the tunnel's communications spine in a \
tunnel, a signalised junction's cabinet in town, an ITS point on the road \
in open country. A unit with no line passes its messages by its own radio \
to the nearest unit that has one. Each unit sends the centre a short \
"still working" message at regular intervals, and a unit whose message \
stops coming is taken as failed. When a receiver sees GPS jamming or \
spoofing it passes that to a nearby broadcast unit, and the warning \
reaches the centre the same way."""
affects = "kendi hattı olmayan direklerin OPEX'ini"
affects_en = "OPEX of anchors with no line of their own"

