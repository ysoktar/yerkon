source_en = """median developer salary, companies in Türkiye, net 95000 TL a month (Yazılımcı Maaşları 2026 survey, February 2026, 1223 respondents); a 6 vCPU, 8 GB virtual server 374,90 TL a month (Karekod, cheapest VDS prices, 25 September 2026)"""
note = """Merkezî yönetim sistemini işletmenin bir birime düşen yıllık payı. Sistem, birimlerin kayıtlarını izleyen ve arızayı ekibe bildiren yazılım ile onu yürüten kişidir. Bir yazılımcının haftada bir günü: 95000 x 12 x 0,2 = 228000 TL; birbirinin yedeği iki sunucu: 2 x 374,90 x 12 = 8998 TL. Toplam 236998, yuvarlanarak 237000 TL/yıl. Haftada bir günlük bir kişi ve iki sunucu bin birimin kayıtlarını izleyebilir; tablo da birimleri 1000 adetlik fiyatla hesaplar. Bu yüzden gider bin birime bölünür: 237000 / 1000 = 237 TL/yıl. Haftada bir gün ve bin birim, YERKON'un işletme tercihi."""
note_en = """Each unit's yearly share of running the central management system. The system is the software that watches the units' records and tells the crew of a failure, and the person who runs it. One day a week of a developer: 95000 x 12 x 0,2 = 228000 TL; two servers backing each other up: 2 x 374,90 x 12 = 8998 TL. 236998, rounded to 237000 TL a year. One person one day a week and two servers can watch the records of a thousand units, and the table prices the units at a thousand. So the cost is split across a thousand units: 237000 / 1000 = 237 TL a year. One day a week and a thousand units are YERKON's operating choice."""
