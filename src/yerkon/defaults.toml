[values."site.shadow_sigma_db"]
value = 4.0
unit = "dB"
provenance = "STANDARD"
source = "3GPP TR 38.901 Tablo 7.4.1-1, görüş hattı olan senaryolar"
source_en = "3GPP TR 38.901 Table 7.4.1-1, the line-of-sight scenarios"
note = """Aynı anten, aynı mesafe, aynı görünen zemin — ve ölçülen kayıp aynı \
değil. Kaldırımdaki kamyonet, iki örnek arasına düşen bina köşesi, bir \
sıra ağaç, modelin yuvarladığı o bir kat. Model ortancayı taşır, bu da \
etrafındaki yayılımı; desibel cinsinden normal olduğu için log-normal \
sönümleme denir. Yayımlanan karasal modellerin hepsinde bir tane var ve \
2 GHz civarında 4 ile 8 dB arasında veriliyor (3GPP TR 38.901'in senaryo \
başına gölge sönümlemesi; ITU-R P.1546 ve P.1812'nin konum \
değişkenliği). Bu, **yolda bir şey olmadığında** geçerli olanı: TR \
38.901 üç senaryonun üçünde de görüş hattı için 4 dB veriyor. Yol \
kapalıysa `site.shadow_sigma_obstructed_db` geçerli (ADR-0061). Sıfır \
yazmak onu kapatır ve modeli her hücrenin ya geçtiği ya kaldığı hâline \
döndürür."""
note_en = """The same antenna, the same distance, ground that looks the same — and \
the loss is not the same. A van at the kerb, a building corner that \
falls between two profile samples, a row of trees, the one storey this \
rounded off. The model carries the median and this is the spread around \
it; normal in decibels, which is why it is called log-normal fading. \
Every published terrestrial model has one, and around 2 GHz they give 4 \
to 8 dB (3GPP TR 38.901's per-scenario shadow fading; ITU-R P.1546 and \
P.1812 as location variability). This is the figure for a path with \
**nothing in the way**: TR 38.901 gives 4 dB for line of sight in all \
three of its scenarios. A blocked path uses \
`site.shadow_sigma_obstructed_db` instead (ADR-0061). Zero switches it \
off and returns the model to one where every cell either passes or does \
not."""
affects = """her bağlantının kapanıp kapanmadığını, dolayısıyla kullanılabilirlik ve \
alan sütunlarını"""
affects_en = """whether each link closes, and so the availability and area columns"""
sensitivity = """kapsama kenarını bir çizgiden bir geçişe çeviriyor: altı desibellik bir \
yayılım, ortanca kaybın tam çıtada olduğu her yerde bağlantıların \
yarısını kaybettiriyor"""
sensitivity_en = """it turns the coverage edge from a line into a gradient: six decibels of \
spread loses half the links anywhere the median loss sits exactly on the \
bar"""

[values."site.shadow_sigma_obstructed_db"]
value = 7.82
unit = "dB"
provenance = "STANDARD"
source = "3GPP TR 38.901 Tablo 7.4.1-1, UMi-Street Canyon NLOS"
source_en = "3GPP TR 38.901 Table 7.4.1-1, UMi-Street Canyon NLOS"
note = """Yolda bir şey olduğunda yayılım genişliyor. Yayımlanan modellerin \
hepsi ikisini ayırıyor: TR 38.901 sokak kanyonunda görüş varken 4 dB, \
yokken 7,82; şehir makro hücresinde 4 ve 6; kırsalda 4 ve 8. Sebep \
fiziksel. Doğrudan ışın varken gelen alan tek bir yoldan geliyor ve \
sapma o yolun etrafındaki tek tük engellerden ibaret; ışın kesildiğinde \
gelen şey kenarların üzerinden dolaşan bir toplam ve her kenar kendi \
şansı. Bu proje bu satıra kadar tek bir 6 dB taşıyordu, yani açık \
yolları fazla, kapalı yolları eksik cezalandırıyordu. Hangisinin \
kullanıldığına zemin karar veriyor: iki uç arasındaki düz çizgi araziyi \
ve dünyanın kendi kavisini geçiyorsa açık (ADR-0061). Kızılay'da \
bağlantıların %98,1'i kapalı, Polatlı'da %79,4'ü, tünelde hiçbiri."""
note_en = """The spread widens when something is in the way. Every published model \
splits the two: TR 38.901 gives 4 dB with line of sight and 7,82 without \
it in a street canyon, 4 and 6 in an urban macrocell, 4 and 8 in a rural \
one. The reason is physical. With a direct ray the field arrives along \
one path and the variation is whatever sits beside it; with the ray gone \
what arrives is a sum over edges and each edge is its own piece of luck. \
This project carried one 6 dB figure until this row, which overcharged \
clear paths and undercharged blocked ones. The ground decides which \
applies: a path is clear when the straight line between the ends passes \
over the terrain and the earth's own curve (ADR-0061). Over Kızılay \
98,1 % of links are blocked, over Polatlı 79,4 %, in the tunnel none."""
affects = """kapalı yollarda her bağlantının kapanıp kapanmadığını, yani şehir ve \
kırsal satırların neredeyse tamamını"""
affects_en = """whether each link over a blocked path closes, which is almost all of the \
urban and rural rows"""
sensitivity = """şehirde bağlantıların %98'ini kapsıyor, tünelde hiçbirini"""
sensitivity_en = """it covers 98 % of the urban row's links and none of the tunnel's"""

[values."site.profile_spacing_m"]
value = 10.0
unit = "m"
provenance = "ASSUMPTION"
source = "bu proje"
source_en = "this project"
note = """Bir bağlantının zemin profilinin kaç metrede bir okunduğu. Sıfır, \
sabit 64 örnek demek, yani aralık bağlantının boyuna göre değişiyor: \
1 km'lik bir şehir bağlantısında 15 m, 6,9 km'lik bir kırsal bağlantıda \
108 m, hücreleri 30 m olan bir ızgaranın üzerinde. Bullington'ın kurgusu \
örnekler üzerinden bir maksimum aldığı için eksik örnekleme yalnızca \
eksik okur: Polatlı'da 108 m'de 31,28 dB, 6,7 m'de 37,60. Bir değer \
verildiğinde profil o aralıkta okunuyor, 32 örnek tabanı ve 2048 \
tavanıyla. On metre, 30 m'lik hücrenin içine üç örnek düşürüyor ve \
yakınsamanın 0,3 dB altında kalıyor; yirmi yedi metre 6,32 dB'lik \
farkın yalnızca üçte ikisini kapatıyor. Bedeli tablonun kendisinde \
ölçüldü: 4 dk 46 sn yerine 15 dk 33 sn (ADR-0062). Sıfır yazmak sabit \
64 örneğe döner."""
note_en = """How many metres apart a link's ground profile is read. Zero means a \
fixed 64 samples, so the spacing depends on the link's length rather \
than on the ground: 15 m on a 1 km urban link, 108 m on a 6,9 km rural \
one, over a grid whose own cells are 30 m across. Bullington's \
construction takes a maximum over the samples, so undersampling can only \
read low: over Polatlı 31,28 dB at 108 m against 37,60 at 6,7 m. Given a \
value, the profile is read at that spacing, with a floor of 32 samples \
and a ceiling of 2048. Ten metres puts three samples inside a 30 m cell \
and lands within 0,3 dB of convergence, where 27 m closes only two \
thirds of the 6,32 dB gap. The cost was measured on the table itself: \
15 min 33 s against 4 min 46 s (ADR-0062). Zero returns it to a fixed \
64 samples."""
affects = """kırınımın ne kadar okunduğunu, dolayısıyla uzun bağlantıların kapanıp \
kapanmadığını"""
affects_en = """how much diffraction is read, and so whether long links close"""
sensitivity = """kırsal satırda belirleyici: 64 sabit örnekte P95 15,75 m, 10 m aralıkta \
30,03 m; şehir satırında 6,20'den 5,83'e"""
sensitivity_en = """decisive in the rural row: P95 15,75 m at a fixed 64 samples against \
30,03 m at 10 m spacing; in the urban row 6,20 to 5,83"""

