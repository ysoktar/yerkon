büyüdüğü için sık gelen tur çıtayı daha sık geçiyor. Maliyet değişmiyor."""
note_en = """How many anchors a unit polls before it is fixed. On the 600 \
m grid over four seeds at full resolution: with 8, 72,67 %, 71,99 %, 73,68 \
%, 72,54 %; with 12, 68,66 %, 69,30 %, 69,81 %, 69,94 %. Eight leads on \
