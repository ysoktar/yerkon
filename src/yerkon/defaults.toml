[values."mounting.distribution_pole.height_m"]
value = 10.0
unit = "m"
provenance = "ASSUMPTION"
source = """direk boyları: TEDAŞ-MLZ/99-34 santrifüj betonarme direk şartnamesi (9,3-10-11 m, 12-13-14 m, 15-16 m ve üstü); iletkene mesafe: Elektrik Kuvvetli Akım Tesisleri Yönetmeliği, hava hattı iletkenlerinin haberleşme hatlarına en küçük düşey uzaklığı orta gerilimde 2,5 m, alçak gerilimde 1 m; gömülme derinliği için bir kaynak bulunamadı"""
source_en = """pole lengths: TEDAŞ-MLZ/99-34, spun concrete pole specification (9,3-10-11 m, 12-13-14 m, 15-16 m and up); distance from the conductors: the Regulation on Electrical Power Installations, least vertical distance from overhead conductors to communication lines 2,5 m at medium voltage and 1 m at low voltage; no source was found for the buried depth"""
note = """Kırsal dağıtım direğinde birimin yerden yüksekliği: direğin toprak üstündeki boyu eksi orta gerilim iletkenlerine 2,5 m. Direk boyları bir küme (TEDAŞ), mesafe yönetmelikten; direğin ne kadarının toprağa gömüldüğü için kaynak bulunamadı, bu yüzden değer hâlâ varsayım. Kırsal satır aynı yerleşimle üç yükseklikte çalıştırıldı (29 Eylül 2026): 6 m'de HPE P95 8,67 m, kullanılabilirlik %91,00, alan 327,50 km², CAPEX 1232 TL/km²; 8 m'de 8,22 m, %93,26, 344,58 km², 1171 TL/km²; 10 m'de tablodaki değerler. Birim alçaldıkça kapsama ve kullanılabilirlik düşüyor."""
note_en = """How high a unit stands on a rural distribution pole: the pole's height above ground less 2,5 m to the medium-voltage conductors. The pole lengths are a set (TEDAŞ) and the distance comes from the regulation; no source was found for how much of the pole is buried, so the value is still an assumption. The rural row was run at three heights on the same placement (29 September 2026): at 6 m HPE P95 8,67 m, availability 91,00 %, area 327,50 km², CAPEX 1232 TL/km²; at 8 m 8,22 m, 93,26 %, 344,58 km², 1171 TL/km²; at 10 m the table's own figures. The lower the unit, the less it covers and the less often it gives a position."""
affects = "kırsal satırın menzilini ve kapsamasını"
affects_en = "the rural row's reach and coverage"

