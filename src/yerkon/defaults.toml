alışverişler arasında değişmemekte ve ortalama alınarak \
giderilememektedir. On beş santimetre, yol kenarındaki bir yapının \
dikkatli bir GNSS ölçümüyle ulaşılabilen doğruluktur."""
note_en = """How well a unit's own position is known. The estimator is given the \
surveyed position and treats it as exact, so whatever is wrong with it \
goes straight into every fix that unit contributes to. Fixed per \
unit rather than drawn per measurement: a survey error does not change \
between exchanges and does not average out. Fifteen centimetres is what \
a careful GNSS survey of a roadside structure achieves."""
affects = "HPE'nin altındaki, hiçbir ölçümün kaldıramadığı tabanı: sıfır alınırsa tünelde HPE P50 0,12 m, P95 0,46 m olur"
affects_en = "a floor under HPE that no amount of ranging removes: set to zero, the tunnel's HPE P50 becomes 0,12 m and P95 0,46 m"

