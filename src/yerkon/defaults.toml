note = """Bir bağlantının zemin profilinin kaç metrede bir örneklendiğidir. \
Sıfır değeri sabit 64 örnek anlamına gelmekte olup örnekleme aralığı \
bağlantının uzunluğuna göre değişmektedir: hücreleri 30 m olan bir \
ızgara üzerinde 1 km'lik bir şehir bağlantısında 15 m, 6,9 km'lik bir \
kırsal bağlantıda 108 m. Bullington yöntemi örnekler üzerinden en \
büyük değeri aldığından seyrek örnekleme kaybı yalnızca eksik \
hesaplamaktadır: Polatlı'da 108 m'de 31,28 dB, 6,7 m'de 37,60 dB. Bir \
değer girildiğinde profil, en az 32 ve en fazla 2048 örnekle bu \
aralıkta örneklenmektedir. On metrelik aralık, 30 m'lik hücreye üç \
örnek düşürmekte ve yakınsamış değerin 0,3 dB altında kalmaktadır; \
yirmi yedi metrelik aralık ise 6,32 dB'lik farkın yalnızca üçte \
ikisini kapatmaktadır. Bunun bedeli, tablonun 4 dk 46 sn yerine 15 dk \
33 sn'de hesaplanmasıdır. Sıfır girilmesi sabit 64 örneğe dönülmesini \
sağlamaktadır."""
note_en = """How many metres apart a link's ground profile is read. Zero \
means a fixed 64 samples, so the spacing depends on the link's length \
rather than on the ground: 15 m on a 1 km urban link, 108 m on a 6,9 km \
rural one, over a grid whose own cells are 30 m across. Bullington's \
construction takes a maximum over the samples, so undersampling can only \
read low: over Polatlı 31,28 dB at 108 m against 37,60 at 6,7 m. Given a \
value, the profile is read at that spacing, with a floor of 32 samples and \
a ceiling of 2048. Ten metres puts three samples inside a 30 m cell and \
lands within 0,3 dB of convergence, where 27 m closes only two thirds of \
the 6,32 dB gap. The cost: the table takes 15 min 33 s instead of 4 min 46 \
s. Zero returns it to a fixed 64 samples."""
affects = """kırınımın ne kadar okunduğunu, dolayısıyla uzun bağlantıların kapanıp \
kapanmadığını"""
affects_en = """how much diffraction is read, and so whether long links close"""
sensitivity = """kırsal satırda belirleyici: 64 sabit örnekte P95 15,75 m, 10 m aralıkta \
