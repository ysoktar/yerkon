note = """Aynı anten, aynı mesafe ve görünüşte aynı zemin koşullarında ölçülen \
kayıp aynı olmamaktadır. Kaldırımdaki bir kamyonet, iki örnek noktası \
arasına düşen bir bina köşesi, bir sıra ağaç veya modelin yuvarladığı \
bir bina katı bu farka yol açmaktadır. Model ortanca değeri, bu \
parametre ise ortanca etrafındaki yayılımı temsil etmektedir; desibel \
cinsinden normal dağıldığı için log-normal sönümleme olarak \
adlandırılmaktadır. Yayımlanmış karasal modellerin tamamında bu \
parametre bulunmakta ve 2 GHz civarında 4 ile 8 dB arasında \
verilmektedir (3GPP TR 38.901'in senaryo bazında gölge sönümlemesi; \
ITU-R P.1546 ve P.1812'nin konum değişkenliği). Bu değer **görüş hattı \
açıkken** geçerlidir: TR 38.901, üç senaryonun üçünde de görüş hattı \
için 4 dB vermektedir. Görüş hattı kapalıysa \
`site.shadow_sigma_obstructed_db` kullanılmaktadır. Sıfır girilmesi \
gölgelemeyi kapatmakta ve modeli her hücrenin ya geçtiği ya kaldığı \
bir yapıya dönüştürmektedir."""
note_en = """The same antenna, the same distance, ground that looks the \
same, and still the loss is not the same. A van at the kerb, a building \
corner that falls between two profile samples, a row of trees, the one \
storey this rounded off. The model carries the median and this is the \
spread around it; normal in decibels, which is why it is called log-normal \
fading. Every published terrestrial model has one, and around 2 GHz they \
give 4 to 8 dB (3GPP TR 38.901's per-scenario shadow fading; ITU-R P.1546 \
and P.1812 as location variability). This is the figure for a path with \
**nothing in the way**: TR 38.901 gives 4 dB for line of sight in all \
three of its scenarios. A blocked path uses \
`site.shadow_sigma_obstructed_db` instead. Zero switches it off and \
returns the model to one where every cell either passes or does not."""
affects = """her bağlantının kapanıp kapanmadığını, dolayısıyla kullanılabilirlik ve \
alan sütunlarını"""
affects_en = """whether each link closes, and so the availability and area columns"""
sensitivity = """kapsama kenarını bir çizgiden bir geçişe çeviriyor: altı desibellik bir \
