[values."site.fix_horizontal_sigma_m"]
value = 5.78
unit = "m"
provenance = "DERIVED"
source = "bu proje, HPE P95 < 10 m hedefinden"
source_en = "this project, from the HPE P95 < 10 m target"
note = """Bir konumun "var" sayılması için filtrenin kendi yatay \
belirsizliğinin (kovaryansın izinin karekökü, bir sigma) en fazla bu \
olması gerekir. Sunumun hedefi yatay hatada P95 < 10 m. İki boyutlu, eşit \
dağılımlı bir hata için %95'lik yarıçap her eksende sigmanın 2,448 \
katıdır; 10 m / 2,448 = 4,08 m her eksende, iki eksenin toplamı olarak \
4,08 × √2 = 5,78 m."""
note_en = """For a position to count as available, the filter's own \
horizontal uncertainty (square root of the covariance trace, one sigma) \
must be at most this. The deck's target is horizontal P95 < 10 m. For a \
two-dimensional error equal in both axes the 95 % radius is 2,448 sigma \
per axis; 10 m / 2,448 = 4,08 m per axis, 4,08 × √2 = 5,78 m over both."""
affects = "kullanılabilirliği ve hangi konumların hataya sayıldığını"
affects_en = "availability, and which positions count towards the error"

