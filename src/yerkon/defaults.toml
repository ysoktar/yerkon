sensitivity = """1 yapmak her direği bağlar ve bağlantı kalemini sıfırlar; 0 yapmak hiçbirini bağlamaz"""
sensitivity_en = """setting it to 1 connects every unit and zeroes the connectivity line; 0 connects none"""

