source_en = """YERKON design choice; ETSI EN 302 065-3 V2.1.1, 4.3.4.2 and table 4; \
BTK exemption criteria for short range devices, Article 18(2), table 17"""
note = """Bir birimin tünelde, yol yüzeyinin üstünde askıya alındığı \
yükseklik. Araçtaki UWB, anteninin montaj düzleminin üstüne -53,3 \
dBm/MHz'den fazla yayamıyor; altına -41,3 dBm/MHz yayabiliyor. Birim araç \
anteninin (1,5 m) altında durunca aracın cevabı bu sınıra takılmıyor. \
Daha alçak bir birim menzili uzatmıyor: 50 m aralıkta 0,5 m ile 1,2 m \
aynı kullanılabilirliği veriyor. Ağır araçların birimin önünü kapatması \
modelde yok."""
note_en = """The height a unit is bracketed at in a tunnel, above the road \
surface. A vehicle's UWB may send no more than -53,3 dBm/MHz above the \
plane its antenna is mounted in, and -41,3 dBm/MHz below it. A unit below \
the vehicle's antenna (1,5 m) keeps the vehicle's reply clear of that \
limit. A lower unit does not add reach: at 50 m spacing 0,5 m and 1,2 m \
give the same availability. Heavy vehicles blocking a unit are not \
modelled."""
affects = "tünel içinde kullanılabilir menzili"
affects_en = "usable range inside a bore"

