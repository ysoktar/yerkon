[values."site.shadow_sigma_db"]
value = 4.0
unit = "dB"
provenance = "STANDARD"
source = "3GPP TR 38.901 Tablo 7.4.1-1, görüş hattı olan senaryolar"
source_en = "3GPP TR 38.901 Table 7.4.1-1, the line-of-sight scenarios"
note = """Aynı anten, aynı mesafe, aynı görünen zemin, ama ölçülen kayıp \
aynı değil. Kaldırımdaki kamyonet, iki örnek arasına düşen bina köşesi, \
bir sıra ağaç, modelin yuvarladığı o bir kat. Model ortancayı taşır, bu da \
etrafındaki yayılımı; desibel cinsinden normal olduğu için log-normal \
sönümleme denir. Yayımlanan karasal modellerin hepsinde bir tane var ve 2 \
GHz civarında 4 ile 8 dB arasında veriliyor (3GPP TR 38.901'in senaryo \
başına gölge sönümlemesi; ITU-R P.1546 ve P.1812'nin konum değişkenliği). \
Bu, **yolda bir şey olmadığında** geçerli olanı: TR 38.901 üç senaryonun \
üçünde de görüş hattı için 4 dB veriyor. Yol kapalıysa \
`site.shadow_sigma_obstructed_db` geçerli. Sıfır yazmak onu kapatır ve \
modeli her hücrenin ya geçtiği ya kaldığı hâline döndürür."""
note_en = """The same antenna, the same distance, ground that looks the \
same, and still the loss is not the same. A van at the kerb, a building \
corner that falls between two profile samples, a row of trees, the one \
storey this rounded off. The model carries the median and this is the \
spread around it; normal in decibels, which is why it is called log-normal \
fading. Every published terrestrial model has one, and around 2 GHz they \
give 4 to 8 dB (3GPP TR 38.901's per-scenario shadow fading; ITU-R P.1546 \
and P.1812 as location variability). This is the figure for a path with \
**nothing in the way**: TR 38.901 gives 4 dB for line of sight in all \
three of its scenarios. A blocked path uses \
`site.shadow_sigma_obstructed_db` instead. Zero switches it off and \
returns the model to one where every cell either passes or does not."""
