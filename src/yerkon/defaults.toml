provenance = "DESIGN"
source = "bu proje, bir yerleşim kararı olarak"
source_en = "this project, as a deployment choice"
note = """Zemin başka bir şeye dönüşene kadar kaç metre gidildiği. Bir şehir \
örtüsünü her bir iki blokta değiştirir: asfalt, kaldırım, bir park, bir \
otopark. İki yüz metre kabaca budur. İnce katmanlar bunun altıya \
bölünmüşüdür, yani tek bir değer bütün merdiveni kurar."""
note_en = """How far you travel before the ground is something else. A town changes \
cover every block or two: tarmac, pavement, a park, a car park. Two \
hundred metres is roughly that. The finer levels are this divided by \
six, so one figure sets the whole ladder."""
affects = """şehir içi satırda yansıtıcı yüzeyin bir bağlantı boyunca ne çabuk \
