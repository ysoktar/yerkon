[values."ranging.anchor_survey_sigma_m"]
value = 0.15
unit = "m"
provenance = "ASSUMPTION"
source = "bu proje"
source_en = "this project"
note = """Bir direğin kendi konumunun ne kadar iyi bilindiği. Kestiriciye ölçülmüş \
konum verilir ve onu kesin sayar; dolayısıyla o konumdaki hata, o \
direğin katkıda bulunduğu her konuma doğrudan geçer. Ölçüm başına \
çekilmek yerine direk başına sabit: bir ölçüm hatası alışverişler \
arasında değişmez ve ortalamayla kaybolmaz. On beş santimetre, yol \
kenarındaki bir yapının dikkatli bir GNSS ölçümüyle ulaşılan değerdir."""
note_en = """How well an anchor's own position is known. The estimator is given the \
surveyed position and treats it as exact, so whatever is wrong with it \
goes straight into every fix that anchor contributes to. Fixed per \
anchor rather than drawn per measurement: a survey error does not change \
between exchanges and does not average out. Fifteen centimetres is what \
a careful GNSS survey of a roadside structure achieves."""
affects = "HPE'nin altındaki, hiçbir ölçümün kaldıramadığı tabanı"
affects_en = "a floor under HPE that no amount of ranging removes"

[values."ranging.packet_loss"]
value = 0.05
unit = "fraction"
provenance = "ASSUMPTION"
source = "bu proje"
source_en = "this project"
note = """Link bütçesinin modellemediği sebeplerle başarısız olan alışverişlerin \
payı: paylaşımlı bandın geri kalanından gelen girişim, bu çalışmanın \
benzetmediği trafikle çakışmalar ve iki ışınlı modelin ortalamaladığı \
sönümlemeler. 2,4 GHz, kablosuz ağlarla aynı banttır ve bir şehir \
bununla doludur. Yüzde beş hafif yüklü bir banttır; yoğun olanı daha \
kötü, tünel daha iyidir."""
note_en = """Share of exchanges that fail for reasons the link budget does not model: \
interference from the rest of a shared band, collisions with traffic \
this study does not simulate, and fades the two-ray model averages over. \
2,4 GHz is the same band as wireless networking and a town is full of \
it. Five percent is a lightly loaded band; a busy one is worse and a \
tunnel is better."""
affects = "kullanılabilirliği ve bir konumun kaç ölçümden kurulduğunu"
affects_en = "availability, and the number of ranges a fix is built from"

