# --- Zemin neden yapılmış --------------------------------------------
#
# Bütün bir saha için tek bir pürüz değeri, her yansımanın aynı yüzeye
# çarptığını söyler. Bunlar onu yerden yere, iki ya da üç ölçekte ve
# konuma göre belirlenimli olarak değiştirir — bir yama, ortalamayla
# kaybolan bir çekiliş olarak değil, orası hakkında bir olgu olarak
# pürüzlüdür (ADR-0026).

[values."urban.ground_patch_m"]
value = 200.0
unit = "m"
provenance = "DESIGN"
source = "bu proje, bir yerleşim kararı olarak"
source_en = "this project, as a deployment choice"
note = """Zemin başka bir şeye dönüşene kadar kaç metre gidildiği. Bir şehir \
örtüsünü her bir iki blokta değiştirir: asfalt, kaldırım, bir park, bir \
otopark. İki yüz metre kabaca budur. İnce katmanlar bunun altıya \
bölünmüşüdür, yani tek bir değer bütün merdiveni kurar."""
note_en = """How far you travel before the ground is something else. A town changes \
cover every block or two: tarmac, pavement, a park, a car park. Two \
hundred metres is roughly that. The finer levels are this divided by \
six, so one figure sets the whole ladder."""
affects = """şehir içi satırda yansıtıcı yüzeyin bir bağlantı boyunca ne çabuk \
değiştiğini"""
affects_en = """how quickly the reflecting surface changes along a link in the urban row"""

[values."urban.ground_roughness_spread"]
value = 0.7
unit = "fraction"
provenance = "DESIGN"
source = "bu proje, bir yerleşim kararı olarak"
source_en = "this project, as a deployment choice"
note = """Bir yamanın diğerinden ne kadar pürüzlü ya da düz olduğu; tipik değerin \
katları cinsinden bir log-normalin genişliği olarak. Ortalamaya değil \
karesel ortalamaya oturtulmuştur, böylece sahanın ölçülmüş pürüzü tam \
olarak ölçtüğü şeyi ifade etmeyi sürdürür ve üstüne yalnızca \
çevresindeki değişim eklenir. Sıfır her yamayı aynı yapar; bu da yerine \
geçtiği tek değerli modeldir."""
note_en = """How much rougher or smoother one patch is than another, as the width of \
a log-normal in multiples of the typical figure. Centred on mean square \
rather than mean, so the site's measured roughness keeps meaning exactly \
what it measured and only the variation around it is added. Zero makes \
every patch identical, which is the single-figure model this replaced."""
affects = """şehir içi satırda eşevreli yansımanın bağlantıdan bağlantıya ne kadar \
değiştiğini"""
affects_en = """how much the coherent reflection varies link to link in the urban row"""
sensitivity = """Ament çarpanı, pürüz ile sıyırma açısının çarpımında üsteldir; birkaç \
yüz metrede bu, iki ışınlı bir sıfır ile hiç sıfır olmaması arasındaki \
farktır"""
sensitivity_en = """the Ament factor is exponential in roughness times the grazing angle, so \
at a few hundred metres this is the difference between a two-ray null \
and none"""

