yerleşim 907 m rölyefin üzerine oturur; tasarlanmadığı arazide neye mal \
olduğu budur. Boş bırakılırsa modellenmiş zemine düşer; o da tepelidir ve \
asla düz değildir. `yerkon fetch`'in yazdığı her şey (görüntüleyiciden \
