olarak ölçtüğü şeyi ifade etmeyi sürdürür ve üstüne yalnızca \
çevresindeki değişim eklenir. Sıfır her yamayı aynı yapar; bu da yerine \
geçtiği tek değerli modeldir."""
note_en = """How much rougher or smoother one patch is than another, as the width of \
a log-normal in multiples of the typical figure. Centred on mean square \
rather than mean, so the site's measured roughness keeps meaning exactly \
what it measured and only the variation around it is added. Zero makes \
every patch identical, which is the single-figure model this replaced."""
