source = """yazılımcı medyan maaşı, Türkiye'deki şirketler, net aylık 95000 TL (Yazılımcı Maaşları 2026 anketi, Şubat 2026, 1223 katılımcı); 6 vCPU, 8 GB sanal sunucu aylık 374,90 TL (Karekod, en ucuz VDS fiyatları, 25 Eylül 2026)"""
source_en = """median developer salary, companies in Türkiye, net 95000 TL a month (Yazılımcı Maaşları 2026 survey, February 2026, 1223 respondents); a 6 vCPU, 8 GB virtual server 374,90 TL a month (Karekod, cheapest VDS prices, 25 September 2026)"""
note = """Merkezî Yönetim Sistemi'nin işletme giderinden bir birime düşen yıllık \
