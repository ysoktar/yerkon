[values."ranging.turnaround_s"]
value = 0.0003
unit = "s"
provenance = "ASSUMPTION"
source = "this project"
note = """Time a radio needs between receiving a frame and answering it: \
transceiver turnaround plus whatever the host does. Short next to an SF10 \
frame and not next to a UWB one."""
affects = "single-sided clock error and the round duration"

[values."ranging.payload_bytes"]
value = 16.0
unit = "bytes"
provenance = "ASSUMPTION"
source = "this project"
note = """Addresses, a sequence number, and the timestamps a double-sided \
exchange carries in its last frame. The preamble dominates either way."""
affects = "air time, and therefore how often each unit is fixed"

[values."site.urban_clutter_db_per_km"]
value = 30.0
unit = "dB/km"
provenance = "ASSUMPTION"
source = "this project"
note = """Absorption by buildings, vegetation and traffic that height does not \
clear. Thirty is the middle of the published range for dense built-up areas \
at 2,4 GHz."""
affects = "how far an urban anchor reaches, and therefore the urban row entirely"

[values."ranging.anchor_survey_sigma_m"]
value = 0.15
unit = "m"
provenance = "ASSUMPTION"
source = "this project"
note = """How well an anchor's own position is known. The estimator is given \
the surveyed position and treats it as exact, so whatever is wrong with it goes \
straight into every fix that anchor contributes to. Fixed per anchor rather than \
drawn per measurement: a survey error does not change between exchanges and does \
not average out. Fifteen centimetres is what a careful GNSS survey of a roadside \
structure achieves."""
affects = "a floor under HPE that no amount of ranging removes"

[values."ranging.packet_loss"]
value = 0.05
unit = "fraction"
provenance = "ASSUMPTION"
source = "this project"
note = """Share of exchanges that fail for reasons the link budget does not \
model: interference from the rest of a shared band, collisions with traffic this \
study does not simulate, and fades the two-ray model averages over. 2,4 GHz is \
the same band as wireless networking and a town is full of it. Five percent is a \
lightly loaded band; a busy one is worse and a tunnel is better."""
affects = "availability, and the number of ranges a fix is built from"

[values."site.urban_packet_loss"]
value = 0.15
unit = "fraction"
provenance = "ASSUMPTION"
source = "this project"
note = """The same, in town, where the band is congested. Nothing measures this \
and it is the difference between an urban availability that reads like a rural \
one and an urban availability that reads like a town."""
affects = "the urban row's availability"

[values."estimator.manoeuvre_m_s2"]
value = 1.5
unit = "m/s^2"
provenance = "ASSUMPTION"
source = "this project"
note = """Unmodelled acceleration the filter expects between measurements. A \
vehicle braking hard is about 6; ordinary driving is well under 1. Too small \
and the filter stops believing new measurements; too large and it stops \
smoothing."""
affects = "HPE, through how much the filter smooths"

[values."site.urban_relief_m"]
value = 91.0
unit = "m"
provenance = "MEASUREMENT"
source = "Copernicus DEM 30 m, Ankara Kızılay 39,91-39,94 N 32,82-32,85 E, fetched 2026-09-10"
note = """Ground rise and fall across the three kilometres of town the urban row describes. Used only when the fetched site is not on hand: with it, the ground is the real grid and this is what that grid measured. Nowhere is flat, and a fallback that was would make the urban row a different study from the one the cache produces (ADR-0021)."""
affects = "the urban row's obstruction and reflection geometry when no site is fetched"
sensitivity = "flat ground gives every reflection the specular angle the two-ray model assumes, which is the worst case for it"

[values."site.urban_relief_wavelength_m"]
value = 1800.0
unit = "m"
provenance = "DERIVED"
source = "Copernicus DEM 30 m, Ankara Kızılay, fetched 2026-09-10"
note = """How far apart the rises are, from the same grid. Ankara's centre sits across a valley and two ridges over this distance, so the fallback has to undulate over roughly this span rather than over a corridor's several kilometres."""
affects = "how often a link in the urban fallback has ground in the way"

[values."site.rural_relief_m"]
value = 907.0
unit = "m"
provenance = "MEASUREMENT"
source = "Copernicus DEM 30 m, Gölbaşı 39,66-39,84 N 32,78-33,02 E, fetched 2026-09-10"
note = """Ground rise and fall across the twenty kilometres of open country the rural row describes. Real Anatolian steppe climbs most of a kilometre over that distance, which is more than twenty times the relief this project used before anybody fetched the ground."""
affects = "the rural row's obstruction geometry when no site is fetched"
sensitivity = "the old 40 m figure let almost every rural link run clear; 907 m does not"

[values."site.rural_relief_wavelength_m"]
value = 6000.0
unit = "m"
provenance = "DERIVED"
source = "Copernicus DEM 30 m, Gölbaşı, fetched 2026-09-10"
note = """How far apart the ridges are, from the same grid. Long enough that a four kilometre anchor spacing does not sit at one lucky point on the profile."""
affects = "how often a link in the rural fallback is blocked by a ridge"

[values."site.tunnel_grade"]
value = 0.0179
unit = "fraction"
provenance = "MEASUREMENT"
source = "Copernicus DEM 30 m, Kızılcahamam 40,41-40,43 N 32,61-32,63 E, fetched 2026-09-10"
note = """Fall of the bore from one portal to the other, over two kilometres. Taken from the real ground at the two portals of an alignment that keeps between nine and a hundred and fifty-six metres of rock above it. It sits inside the half to three percent a road tunnel is built to for drainage, which is the check that this is an alignment somebody could build rather than a line through a hill."""
affects = "the tunnel row's vertical geometry, and therefore its VPE"
sensitivity = "a level floor would put every anchor and every receiver at one height, which no tunnel is built to"
