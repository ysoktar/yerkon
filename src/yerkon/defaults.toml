note_en = """How much rougher or smoother one patch is than another, as \
the width of a log-normal in multiples of the typical figure. Centred on \
mean square rather than mean, so the site's measured roughness keeps \
meaning exactly what it measured and only the variation around it is \
added. Zero makes every patch identical."""
