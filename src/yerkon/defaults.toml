[values."clock.crystal.residual_ppm"]
value = 0.0793
unit = "ppm"
provenance = "MEASUREMENT"
source = "matlab/yerkon_clock_residual.m, 2026-09-10 koşumu"
source_en = "matlab/yerkon_clock_residual.m, run 2026-09-10"
note = """Taşıyıcı frekans kayması kestirimi geriye ne bırakıyor. İlinti sonrası \
+10 ile +40 dB arasındaki en kötü karesel ortalama artık; 2, 5, 10 ve 20 \
ppm'lik kristal kaymaları için. Gürültüyle değil, yanlılıkla sınırlı: \
otuz desibel daha fazla sinyal bunu ancak iki kat iyileştirir, çünkü \
taban kanal değil parabolik tepe aradeğerleyicisidir. Hiç gürültü yokken \
aynı kestirici, yalnızca tepenin gözler arasında nereye düştüğüne bağlı \
olarak 0,0164 ile 0,0643 ppm verir; bu da ölçülen platoyla dört basamağa \
kadar uyuşur. Sistematik hata, tekrarlanan alışverişlerde ortalamayla \
azalmaz. Yalnız toplanır gürültü: faz gürültüsü, çok yolluluk ve \
alışveriş sırasında sürüklenme yok; gerçek bir parça bundan kötü \
olacaktır."""
note_en = """What a carrier frequency offset estimate leaves behind. Worst \
root-mean-square residual over +10 to +40 dB after correlation, for \
crystal offsets of 2, 5, 10 and 20 ppm. Bias-limited rather than \
noise-limited: thirty decibels more signal improves it only twice, \
because the floor is the parabolic peak interpolator and not the \
channel. With no noise at all the same estimator gives 0,0164 to 0,0643 \
ppm depending only on where the peak falls between bins, which matches \
the measured plateau to four decimals. A systematic error does not \
average down over repeated exchanges. Additive noise only: no phase \
noise, no multipath and no drift during the exchange, so a real part \
will be worse."""
affects = "yavaş modülde tek yönlü ölçümün kullanılabilir olup olmadığını"
affects_en = "whether single-sided ranging is usable at all on the slow radio"
sensitivity = """Bu değerde tek yönlü saat terimi 0,19 m; ölçülen 2,94 \
m'lik tabanın yanında hiçbir şey katmıyor. Anlam kazanması için on beş \
