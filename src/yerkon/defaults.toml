source = """YERKON tasarım tercihi; ETSI EN 302 065-3 V2.1.1, 4.3.4.2 ve Tablo 4; BTK \
Kısa Mesafeli Telsiz Cihazları için Muafiyet Kriterleri, Madde 18(2), \
Tablo 17"""
source_en = """YERKON design choice; ETSI EN 302 065-3 V2.1.1, 4.3.4.2 and table 4; \
BTK exemption criteria for short range devices, Article 18(2), table 17"""
note = """Yayın biriminin tünelde yol yüzeyinin üzerine askıyla yerleştirildiği \
yüksekliktir. Araçtaki UWB cihazı, anteninin montaj düzleminin üzerine \
-53,3 dBm/MHz'den, altına ise -41,3 dBm/MHz'den fazla yayın \
yapamamaktadır. Yayın birimi araç anteninin (1,5 m) altında \
konumlandırıldığında aracın yanıtı bu sınırı aşmamaktadır. Daha alçak \
bir yerleşim menzili artırmamaktadır: 50 m aralıkta 0,5 m ve 1,2 m \
aynı kullanılabilirliği vermektedir. Ağır taşıtların yayın biriminin \
önünü kapatması modele dahil edilmemiştir."""
note_en = """The height a unit is bracketed at in a tunnel, above the road \
surface. A vehicle's UWB may send no more than -53,3 dBm/MHz above the \
plane its antenna is mounted in, and -41,3 dBm/MHz below it. A unit below \
the vehicle's antenna (1,5 m) keeps the vehicle's reply clear of that \
limit. A lower unit does not add reach: at 50 m spacing 0,5 m and 1,2 m \
give the same availability. Heavy vehicles blocking a unit are not \
modelled."""
affects = "tünel içinde kullanılabilir menzili"
affects_en = "usable range inside a bore"

