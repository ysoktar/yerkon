Frequency Band for MIMO Applications", EURASIP JWCN 2009, article 560571, \
equation (2)"""
note = """Tünelde ortalama yol kaybı modelinin sabiti: PL = PL0 + 10 nf \
log10(f, GHz) + 10 nd log10(d). 3,4 km'lik düz, iki şeritli bir karayolu \
tünelinde (yarım daire kesit, çap 8,6 m), 2,8-5 GHz'de ve 50-500 m \
arasında ölçülmüş. Denklem d'nin birimini yazmıyor; makalenin kendi Şekil \
5'indeki model eğrisini d kilometreyle veriyor, model de öyle kullanıyor. \
Kanal 5'in 6,5 GHz'i ölçülen aralığın dışında: frekans terimi oraya \
taşınıyor."""
note_en = """The constant of the tunnel's mean path loss model: PL = PL0 + \
10 nf log10(f, GHz) + 10 nd log10(d). Measured in a straight 3,4 km \
two-lane road tunnel (semicircular section, 8,6 m across), 2,8 to 5 GHz, \
between 50 and 500 m. The equation does not state d's unit; it reproduces \
the paper's own figure 5 with d in kilometres, and the model uses it so. \
Channel 5's 6,5 GHz is outside the measured range: the frequency term \
is carried there."""
affects = "tünel bağlantısının ne kadar uzağa kapandığını"
affects_en = "how far a tunnel link closes"

