note_en = """Which fetched ground this row stands on, by directory name \
under `src/yerkon/site/places/`. The Polatlı plain west of Ankara, where \
the intercity roads run. Set this to `golbasi` to stand the same \
deployment on 907 m of relief instead, which is what it costs in terrain \
it was not designed for. Empty falls back to modelled terrain, which is \
rolling and never flat. Anything `yerkon fetch` writes (including from the \
viewer) can go here."""
affects = "kırsal satırın engel geometrisini, dolayısıyla içindeki her değeri"
