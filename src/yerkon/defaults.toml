hata 0,79 m. Hem üçte bir ucuz hem iki kat hassas. Bedeli \
kullanılabilirlikte: %100'den yaklaşık %99,3'e, çünkü uçtaki birkaç \
bağlantı artık kapanmıyor. 300 m'de bağlantılar toptan kopuyor (%82,7), \
yani 225 m sınırın hemen berisi (ADR-0072)."""
note_en = """How far apart the brackets stand along the bore. The spacing is set by \
geometry rather than by cost, and at 150 m the geometry was bad: packing \
anchors along a corridor gathers them at nearly one point and shortens \
the baseline. Over three seeds at full resolution: at 150 m, 14 brackets, \
106 882 TL, 1,86 m of median error; at 225 m, 9 brackets, 68 710 TL, \
0,79 m. A third cheaper and twice as precise. It costs availability, \
100 % down to about 99,3 %, because a few links at the ends no longer \
close. At 300 m the links fail outright (82,7 %), so 225 m is just \
inside the edge (ADR-0072)."""
affects = """tünel satırının direk sayısını ve sermayesini; tablodaki kilometrekare \
başına en büyük sermaye"""
affects_en = """the tunnel row's anchor count and its capital, which is the largest per \
