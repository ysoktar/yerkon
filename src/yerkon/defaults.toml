note = """Bir ekip günü: sepetli araç 2000 TL x 8 saat x 0,7 = 11200 TL; usta, aylık aralığın ortası 95000 TL'nin 30'da biri 3170 TL; yardımcı, büyükşehir üst bandı 3200 TL. Toplam 17570 TL. Sahalar kilometrelerce ayrı olduğu için ekip günde dört birim takar (dağıtım direğinde günde uğranan birim): 17570 / 4 = 4392 TL; kelepçe ve kablo 300 TL. Toplam 4692, yuvarlanarak 4690 TL. Panel ve akü ayrı: güneş paneli ve akü."""
note_en = """One crew day: bucket truck 2000 TL x 8 hours x 0,7 = 11200 TL; electrician, a thirtieth of the middle of the monthly range, 95000 TL, 3170 TL; helper, the large-city top of the band, 3200 TL. 17570 TL in all. The sites are kilometres apart, so a crew fits four a day (poles a crew reaches in a day): 17570 / 4 = 4392 TL; clamps and cable 300 TL. 4692, rounded to 4690 TL. The panel and battery are priced apart: the solar panel and battery."""
