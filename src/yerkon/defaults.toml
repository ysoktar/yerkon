source_en = """commercial, low voltage, single rate, taxes included 4,78 TL/kWh, January 2026 (forelektrik.com, 26 December 2025); the increase from 4 April 2026, low-voltage public and private services 17,5 % (Milliyet Uzmanpara, 4 April 2026)"""
note = """Yayın biriminin tükettiği elektriğin birim fiyatıdır. Yayın birimi, \
aydınlatma direğinin genel aydınlatma hattından ücretsiz \
beslenememektedir: Genel Aydınlatma Yönetmeliği, bağlantı noktasından \
genel aydınlatma dışında bir amaçla enerji verilmesine izin \
vermemektedir. Bu nedenle birim, ayrı sayaçlı bir ticarethane abonesi \
olarak kabul edilmektedir. 4,78 x 1,175 = 5,62 TL/kWh."""
note_en = """What a unit's electricity costs a kilowatt-hour. A unit cannot draw from a lighting column's public lighting circuit for free: the General Lighting Regulation allows no energy from that connection for any purpose other than public lighting; the unit counts as a separately metered commercial subscriber. 4,78 x 1,175 = 5,62 TL/kWh."""
affects = "şebeke elektriği taşıyan yapılardaki direklerin OPEX'ini"
