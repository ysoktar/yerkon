# Bu projenin ihtiyaç duyduğu, raporun vermediği her değer.
#
# Varsayım değil, varsayılan deniyor; çünkü kalıcı olan bu. Biri bir
# değere kaynak bulunca o değer bu dosyadan çıkmaz, yalnızca varsayım
# olmayı bırakır. Her birinin neye dayandığı `provenance` alanındadır.
#
# Rapor yalnızca bir malzeme listesi verdi. Aşağıdaki her değer, bir
# ölçümün ya da bir teklifin yerini tutan bir vekildir; ve her biri
# koda değil bu dosyaya konmuştur ki kaynak bulmak bir programı
# değiştirmek değil, bir dosyayı düzenlemek olsun.
#
# Gerçek değeri bulunca: `value` alanını değiştir, nereden geldiğini
# `source` alanına yaz ve `provenance` alanını ASSUMPTION yerine
# DATASHEET, MEASUREMENT ya da STANDARD yap. O anda aşağıdaki her şey
# onu varsayım saymayı bırakır ve her sonucun "tahmine dayanıyor"
# diye bildirdiği pay düşer.
#
# `affects`, sayı değişince neyin oynadığını söyler. `sensitivity`
# tahmin değil ölçümdür: değeri iki katına çıkarmanın, `affects` içinde
# adı geçen büyüklüğe ne yaptığıdır.
#
# src/ içindeki hiçbir şey kendi başına bir varsayım kuramaz. Bunu bir
# test zorlar, yani bu dosya listenin tamamıdır.

# --------------------------------------------------------------------------
# Bir montaj yapısı nedir ve kullanmak neye mal olur
# --------------------------------------------------------------------------
# Yükseklikler menzili belirler, menzil de bir koridorun kaç direğe
# ihtiyaç duyduğunu. Maliyetler hangi yapının kazandığını belirler ve
# yerleşim araması bu kararın, projedeki diğer bütün seçimlerden daha
# değerli olduğunu söylüyor.

