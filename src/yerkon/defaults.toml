yarısını kaybettiriyor"""
sensitivity_en = """it turns the coverage edge from a line into a gradient: six decibels of \
spread loses half the links anywhere the median loss sits exactly on the \
bar"""

[values."site.shadow_sigma_obstructed_db"]
value = 7.82
unit = "dB"
provenance = "STANDARD"
source = "3GPP TR 38.901 Tablo 7.4.1-1, UMi-Street Canyon NLOS"
source_en = "3GPP TR 38.901 Table 7.4.1-1, UMi-Street Canyon NLOS"
note = """Görüş hattı kapalı olduğunda yayılım genişlemektedir. Yayımlanmış \
modellerin tamamı iki durumu ayırmaktadır: TR 38.901, sokak kanyonunda \
görüş hattı varken 4 dB, yokken 7,82 dB; şehir makro hücresinde 4 ve 6 \
dB; kırsalda 4 ve 8 dB vermektedir. Bunun nedeni fizikseldir: doğrudan \
ışın varken alan tek bir yoldan gelmekte ve sapma bu yolun \
çevresindeki seyrek engellerden kaynaklanmaktadır; ışın kesildiğinde \
ise gelen sinyal kenarlar üzerinden dolaşan bileşenlerin toplamıdır ve \
her kenar ayrı bir belirsizlik taşımaktadır. Proje daha önce tek bir 6 \
dB değeri kullanıyordu; bu da açık bağlantıları fazla, kapalı \
bağlantıları eksik cezalandırıyordu. Hangi değerin kullanılacağını \
zemin belirlemektedir: iki uç arasındaki düz çizgi araziyi ve \
Dünya'nın eğriliğini geçebiliyorsa bağlantı açık sayılmaktadır. \
Kızılay'da bağlantıların %98,1'i, Polatlı'da %79,4'ü kapalıdır; \
tünelde ise kapalı bağlantı bulunmamaktadır."""
note_en = """The spread widens when something is in the way. Every \
published model splits the two: TR 38.901 gives 4 dB with line of sight \
and 7,82 without it in a street canyon, 4 and 6 in an urban macrocell, 4 \
and 8 in a rural one. The reason is physical. With a direct ray the field \
arrives along one path and the variation is whatever sits beside it; with \
the ray gone what arrives is a sum over edges and each edge is its own \
piece of luck. This project carried one 6 dB figure until this row, which \
overcharged clear paths and undercharged blocked ones. The ground decides \
which applies: a path is clear when the straight line between the ends \
passes over the terrain and the earth's own curve. Over Kızılay 98,1 % of \
links are blocked, over Polatlı 79,4 %, in the tunnel none."""
affects = """kapalı yollarda her bağlantının kapanıp kapanmadığını, yani şehir ve \
kırsal satırların neredeyse tamamını"""
affects_en = """whether each link over a blocked path closes, which is almost all of the \
urban and rural rows"""
sensitivity = """şehirde bağlantıların %98'ini kapsıyor, tünelde hiçbirini"""
sensitivity_en = """it covers 98 % of the urban row's links and none of the tunnel's"""

