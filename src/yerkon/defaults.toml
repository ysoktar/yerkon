[values."urban.junction_every"]
value = 2.0
unit = "anchors"
provenance = "DESIGN"
source = "YERKON tasarım tercihi"
source_en = "YERKON design choice"
note = """Izgara noktalarının sinyalize kavşaklarda bulunan oranıdır: her ikinci \
sıranın her ikinci noktası, yani dörtte biri. Bir şehrin ana \
caddelerinde sinyalize kavşaklar bulunmakta ve bu kavşaklarda hem \
şebeke beslemesi hem de trafik yönetim merkezine giden hat içeren \
sinyal kontrol kabini yer almaktadır. Bu noktadaki yayın birimi, \
belediyenin kameraları ve dedektörleri gibi haberleşme hattını bu \
kabinden almakta ve ayrıca veri hattı satın almamaktadır. Yapı, \
yükseklik ve montaj bedeli aydınlatma direğiyle aynı olduğundan \
geometride herhangi bir değişiklik olmamaktadır. Dörtte bir ihtiyatlı \
bir kabuldür: Ankara merkezinde ana cadde kavşaklarının yarısı da \
savunulabilir bir orandır ve iki kat tasarruf sağlayacaktır."""
note_en = """How much of the grid stands at a signalised junction: every second spot of every second row, so a quarter. A town's main streets are signalised, and a signalised junction already carries a controller cabinet: mains for the heads and a line to the traffic management centre. A unit there does what the municipality's cameras and detectors already do, takes its link from that cabinet, and buys no data plan of its own. The structure, the height and the fitting cost are the same lighting column, so nothing about the geometry moves. A quarter is the conservative reading: half of the main-street junctions in Ankara's centre is defensible too, and saves twice as much."""
affects = "yalnız ızgara yerleşiminde şehir içi satırın bağlantı kalemini; tablodaki satır arama yerleşimini kullanıyor ve kavşaktaki birimi o yerleşim kendisi işaretliyor"
