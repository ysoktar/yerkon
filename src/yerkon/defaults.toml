note = """Bir birimin çektiği elektriğin birim fiyatı. Birim aydınlatma direğinin genel aydınlatma hattından bedava beslenemez: Genel Aydınlatma Yönetmeliği, bağlantı noktasından genel aydınlatma dışında bir amaca enerji verilmesine izin vermiyor; birim ayrı sayaçlı bir ticarethane abonesi sayılıyor. 4,78 x 1,175 = 5,62 TL/kWh."""
