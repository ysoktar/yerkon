unit = "sites/day"
provenance = "DERIVED"
source = """Dicle Elektrik, Diyarbakır Suriçi, 25 Haziran 2026: 11 ekip ve 11 sepetli araç bir hafta sonunda 207 direkteki 414 armatürü değiştirdi"""
source_en = """Dicle Elektrik, Diyarbakır Suriçi, 25 June 2026: 11 crews with 11 bucket trucks replaced 414 luminaires on 207 poles over one weekend"""
note = """Kırsalda bir ekibin günde uğradığı dağıtım direği sayısı. Şehirde direk başına bir saat iş sayılıyor (aydınlatma direğinde günde uğranan birim, Dicle Elektrik örneği). Kırsalda buna yol ekleniyor: sekiz saatlik günün ikisi merkeze gidiş dönüş, sahalar arası her geçiş yarım saat (YERKON'un yol tahmini). (8 - 2) / (1 + 0,5) = 4."""
