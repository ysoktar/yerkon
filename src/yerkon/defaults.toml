source = """sepetli araç: Ankara'da 20 m sepetli araç saati yaklaşık 2000 TL, günlük kiralamada %30 indirim (Ankara Sepetli Vinç Kiralama, fiyat rehberi, 2026); işçilik: elektrik ustası aylık 80000-110000 TL, düz işçi günlük 2500-3200 TL, büyükşehirde üst banda yakın (Yapı Arenası, 12 Ağustos 2026)"""
source_en = """bucket truck: a 20 m bucket truck is about 2000 TL an hour in Ankara, 30 % off by the day (Ankara Sepetli Vinç Kiralama, price guide, 2026); labour: an electrician 80000-110000 TL a month, a labourer 2500-3200 TL a day, near the top in large cities (Yapı Arenası, 12 August 2026)"""
note = """Bir ekip günü: sepetli araç 2000 TL x 8 saat x 0,7 = 11200 TL; usta, aylık aralığın ortası 95000 TL'nin 30'da biri 3170 TL; yardımcı, büyükşehir üst bandı 3200 TL. Toplam 17570 TL. Tünelde iş Karayolları'nın şerit kapatmasına bağlı olduğu için ekip günde dört birim takar (tünelde günde uğranan birim): 17570 / 4 = 4392 TL; paslanmaz askı, dübel ve kablo 300 TL. Toplam 4692, yuvarlanarak 4690 TL. Şerit kapatmanın kendisi Karayolları'nın bakım kapanışına denk getiriliyor, ayrı fiyatlanmadı."""
note_en = """One crew day: bucket truck 2000 TL x 8 hours x 0,7 = 11200 TL; electrician, a thirtieth of the middle of the monthly range, 95000 TL, 3170 TL; helper, the large-city top of the band, 3200 TL. 17570 TL in all. In the tunnel the work depends on the highways authority's lane closure, so a crew fits four a day (tunnel units a crew reaches in a day): 17570 / 4 = 4392 TL; a stainless bracket, anchors and cable 300 TL. 4692, rounded to 4690 TL. The closure itself is timed to the authority's maintenance closures and not priced apart."""
affects = "tünel satırının sermayesinin çoğu"
affects_en = "most of the tunnel row's capital"

