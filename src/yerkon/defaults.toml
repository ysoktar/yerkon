[values."mounting.lighting_column.height_m"]
value = 12.0
unit = "m"
provenance = "STANDARD"
source = """TEDAŞ, LED'li Yol Aydınlatma Tasarımına İlişkin Usul ve Esaslar (Ağustos 2022), Ek-1: M1 sınıfı yollarda direk 12-14 m, M2 ve M3'te 10-12 m, M4'te 8-10 m, M5'te 8 m, yaya yollarında 6-8 m"""
source_en = """TEDAŞ, rules for LED road lighting design (August 2022), annex 1: columns 12 to 14 m on M1 roads, 10 to 12 m on M2 and M3, 8 to 10 m on M4, 8 m on M5, 6 to 8 m on footways"""
note = """Birimin durduğu aydınlatma direğinin boyu. TEDAŞ'ın çizelgesinde boylar bir küme: 6, 8, 10, 12, 14 m, yol sınıfına göre. Kızılay'ın ana caddeleri M1-M3 sınıfında, yani 10-14 m; 12 m bu aralığın ortası. Şehir içi satır kümenin her değeriyle çalıştırıldı (29 Eylül 2026): 8 m'de HPE P95 9,07 m, kullanılabilirlik %94,96, CAPEX 10077 TL/km²; 10 m'de 8,83 m, %96,18, 9358 TL/km²; 12 m'de tablodaki değerler; 14 m'de 8,67 m, %96,82, 8976 TL/km². Kullanılabilirlik ve maliyet yükseklikle düzgün iyileşiyor, P95 iyileşmiyor: 12 m'deki P95 10 ve 14 m'dekinden yüksek. P95, sekiz rastgele gölgeleme tekrarının en kötü ucundan geldiği için bu kadar oynuyor."""
note_en = """How tall the lighting column a unit stands on is. In TEDAŞ's table the heights are a set, 6, 8, 10, 12, 14 m, by road class. Kızılay's main streets are M1 to M3, so 10 to 14 m; 12 m is the middle of that. The town row was run at every value of the set (29 September 2026): at 8 m HPE P95 9,07 m, availability 94,96 %, CAPEX 10077 TL/km²; at 10 m 8,83 m, 96,18 %, 9358 TL/km²; at 12 m the table's own figures; at 14 m 8,67 m, 96,82 %, 8976 TL/km². Availability and cost improve smoothly with height and P95 does not: P95 at 12 m is higher than at 10 m and 14 m. P95 is the tail of eight shadow draws, so it moves this much."""
affects = "aydınlatma direğinden kullanılabilir menzili ve şehir içi satırın alanını"
affects_en = "usable range from a column and the town row's area"

[values."mounting.lighting_column.site_cost_tl"]
value = 2500.0
unit = "TL"
provenance = "DERIVED"
source = """sepetli araç: Ankara'da 20 m sepetli araç saati yaklaşık 2000 TL, günlük kiralamada %30 indirim (Ankara Sepetli Vinç Kiralama, fiyat rehberi, 2026); işçilik: elektrik ustası aylık 80000-110000 TL, düz işçi günlük 2500-3200 TL, büyükşehirde üst banda yakın (Yapı Arenası, 12 Ağustos 2026)"""
source_en = """bucket truck: a 20 m bucket truck is about 2000 TL an hour in Ankara, 30 % off by the day (Ankara Sepetli Vinç Kiralama, price guide, 2026); labour: an electrician 80000-110000 TL a month, a labourer 2500-3200 TL a day, near the top in large cities (Yapı Arenası, 12 August 2026)"""
note = """Bir ekip günü: sepetli araç 2000 TL x 8 saat x 0,7 = 11200 TL; usta, aylık aralığın ortası 95000 TL'nin 30'da biri 3170 TL; yardımcı, büyükşehir üst bandı 3200 TL. Toplam 17570 TL. Bir ekip zaten duran direklere günde sekiz birim takar (aydınlatma direğinde günde uğranan birim, Dicle Elektrik örneğinden): 17570 / 8 = 2196 TL; paslanmaz kelepçe, kablo ve sigorta 300 TL. Toplam 2496, yuvarlanarak 2500 TL. Kutu ve güç kaynağı birimin içinde."""
note_en = """One crew day: bucket truck 2000 TL x 8 hours x 0,7 = 11200 TL; electrician, a thirtieth of the middle of the monthly range, 95000 TL, 3170 TL; helper, the large-city top of the band, 3200 TL. 17570 TL in all. A crew fits eight units a day to columns that already stand (columns a crew reaches in a day, from the Dicle Elektrik example): 17570 / 8 = 2196 TL; stainless clamps, cable and a fuse 300 TL. 2496, rounded to 2500 TL. The enclosure and power supply are inside the unit."""
affects = "aydınlatma direğindeki her direğin CAPEX'ini; şehir içi sermayenin çoğu"
affects_en = "CAPEX of every anchor on a column; most of the urban capital"
sensitivity = """günde sekiz yerine dört birim takılırsa 4690 TL olur ve şehir içi CAPEX yarıdan fazla artar"""
sensitivity_en = """four units a day instead of eight makes it 4690 TL and raises urban CAPEX by more than half"""
[values."mounting.lighting_column.per_crew_day"]
value = 8.0
unit = "sites/day"
provenance = "DERIVED"
source = """Dicle Elektrik, Diyarbakır Suriçi, 25 Haziran 2026: 11 ekip ve 11 sepetli araç bir hafta sonunda 207 direkteki 414 armatürü değiştirdi"""
source_en = """Dicle Elektrik, Diyarbakır Suriçi, 25 June 2026: 11 crews with 11 bucket trucks replaced 414 luminaires on 207 poles over one weekend"""
note = """Bir ekibin bir günde birim taktığı ya da bakımına uğradığı aydınlatma direği sayısı. Yayımlanmış örnek: 11 ekip bir hafta sonunda 207 direkteki 414 armatürü değiştirdi, ekip başına 18,8 direk, 37,6 armatür. Haber kaç saat çalışıldığını yazmıyor, yalnızca gece gündüz diyor; iki günün 12'şer saati sayılırsa bir ekip saatte 1,6 armatür değiştirmiş, sekiz saatlik bir günde 12,5. Bir YERKON birimi direğe bir kelepçe ve bir besleme hattıdır, bir armatürden fazla iş değil. Günde 8 bunun altında kalan ihtiyatlı sayı; direk başına bir saat."""
note_en = """How many lighting columns a crew fits or visits in a day. A published example: 11 crews replaced 414 luminaires on 207 poles over one weekend, 18,8 poles and 37,6 luminaires a crew. The report does not give the hours, only that the work ran day and night; counting 12 hours of each of the two days, a crew replaced 1,6 luminaires an hour, 12,5 in an eight-hour day. A YERKON unit is one clamp and one supply tap on a column, no more work than a luminaire. 8 a day is a cautious figure below that; an hour a column."""
affects = "bu yapıdaki birimlerin montaj ve bakım bedelini"
affects_en = "the fitting and maintenance cost of units on this structure"

