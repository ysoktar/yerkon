source = """Akakçe, Eylül 2026, bulunan en ucuzlar: 10 W güneş paneli 518,72 TL; 12 V 7 Ah kuru akü 524,40 TL; 10 A PWM şarj denetleyicisi 276,67 TL; ABS güneş paneli montaj braket seti 421,01 TL; Çet-San termoplastik sıva üstü buat 260x180x75, IP65, 147,41 TL; 4 mm² solar kablo metresi 25-40 TL (Power Enerji, solar kablo fiyatları 2026)"""
source_en = """Akakçe, September 2026, the cheapest found: 10 W solar panel 518,72 TL; 12 V 7 Ah sealed battery 524,40 TL; 10 A PWM charge controller 276,67 TL; ABS solar panel mounting bracket set 421,01 TL; Çet-San thermoplastic surface box 260x180x75, IP65, 147,41 TL; 4 mm² solar cable 25-40 TL a metre (Power Enerji, solar cable prices 2026)"""
note = """Şebeke bağlantısı bulunmayan bir yapıdaki yayın birimi için panel, \
akü, şarj denetleyicisi, tutucu, muhafaza ve kablo bedelidir. 0,34 \
W'lık bir yük günde 8 Wh enerji gerektirmektedir: Ankara'nın kış \
koşullarında günde iki saatlik tam güneşlenmeyle 10 W'lık panel bu \
enerjiyi sağlamakta, 84 Wh'lik akü ise beş günlük ihtiyacı \
karşılamaktadır. Panel 518,72 + akü 524,40 + denetleyici 276,67 + \
braket 421,01 + akü ve denetleyici için IP65 muhafaza 147,41 + 5 m \
kablo (metresi üst fiyattan 40 TL) 200 = 2.088,21 TL, yuvarlanarak \
2090 TL."""
note_en = """Panel, battery, controller, bracket, box and cable for a unit on a structure with no mains. A 0,34 W load needs 8 Wh a day: a 10 W panel gives that on two hours of full sun in an Ankara winter, and an 84 Wh battery carries five days. Panel 518,72 + battery 524,40 + controller 276,67 + bracket 421,01 + an IP65 box for the battery and controller 147,41 + 5 m of cable at the top price of 40 TL a metre, 200 = 2.088,21, rounded to 2090 TL."""
