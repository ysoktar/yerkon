# Every figure this project needs that the report did not supply.
#
# Called defaults rather than assumptions because that is what it stays.
# A figure does not leave this file when somebody sources it; it just
# stops being an assumption. What each one rests on is its `provenance`.
#
# The report gave a bill of materials and nothing else. Each figure below
# is a placeholder standing in for a measurement or a quotation, and each
# one is here rather than in the code so that sourcing it is an edit to a
# file rather than a change to a program.
#
# When you find the real figure: replace `value`, put where it came from
# in `source`, and change `provenance` from ASSUMPTION to DATASHEET,
# MEASUREMENT or STANDARD. Everything downstream stops counting it as an
# assumption at that moment, and the share each result reports as resting
# on guesses falls.
#
# `affects` says what moves when the number does. `sensitivity` is
# measured, not guessed: it is what doubling the value does to the figure
# named in `affects`.
#
# Nothing in src/ may construct an assumption of its own. A test enforces
# that, so this file is the whole list.

