[values."operating.anchor_kwh_per_year"]
value = 3.0
unit = "kWh/year"
provenance = "DERIVED"
source = "SX1280 ve STM32G0 veri sayfaları, bu projenin hesabı"
source_en = "SX1280 and STM32G0 datasheets, this project's arithmetic"
note = """Bir yayın biriminin yıllık tüketimi. 35 kWh idi, yani sürekli \
4 W: bir SX1280 kartı için on kat fazla. Birim zamanının neredeyse \
tamamında dinliyor; SX1280 dinlerken birkaç mA, mikrodenetleyici bir iki \
mA çeker, 3,3 V'ta ikisi 30 mW'ı bulmaz. Şebeke dönüştürücüsünün boştaki \
kaybı ve yanıt yayınları eklenince ortalama 0,34 W'ı geçmiyor: yılda \
3 kWh. Bu cömert bir üst sınır."""
note_en = """One broadcast unit's yearly consumption. It was 35 kWh, a \
steady 4 W, ten times too much for an SX1280 board. The unit spends \
nearly all its time listening: the SX1280 draws a few mA doing that and \
the microcontroller one or two, under 30 mW together at 3,3 V. With the \
mains converter's idle loss and the replies it sends, the average stays \
under 0,34 W, which is 3 kWh a year. That is a generous upper bound."""
affects = """şebekeli direklerin enerji kalemini ve şebeke dışı beslemenin \
boyutunu"""
affects_en = """the energy line of mains-fed anchors and the size of an \
off-grid supply"""
sensitivity = "enerji kalemi her satırda OPEX'in %2'sinden az"
sensitivity_en = "the energy line is under 2 % of OPEX in every row"

[values."operating.connectivity_tl_per_year"]
value = 0.0
unit = "TL/year"
provenance = "DESIGN"
source = "bu proje, bir tasarım kararı olarak"
source_en = "this project, as a design choice"
note = """Kendi hattı olmayan bir birimin yıllık veri bedeli: sıfır, çünkü \
birimlere SIM kartı konmuyor. Raporda böyle bir şey yok; ilk maliyet \
modeli (ADR-0006) her birime bir hücresel paket varsaymıştı ve kaldırıldı \
(ADR-0079). Merkeze bağ, tünelde tünelin haberleşme omurgasından, şehirde \
ışıklı kavşağın sinyal dolabından geçiyor. Geri kalan birimleri, onlara \
karşı ölçüm yapan telefonlar ve araç alıcıları izliyor: hangi birimin \
cevap verdiğini zaten biliyorlar, dolayısıyla cevap vermeyen birim hattı \
olmadan da görünüyor."""
note_en = """What a year of data costs an anchor with no line of its own: \
nothing, because no unit carries a SIM card. The report says nothing of \
the kind; the first cost model (ADR-0006) assumed a cellular plan per \
anchor and it has been taken out (ADR-0079). The tie to the centre runs \
through the tunnel's own communications spine in a tunnel and a \
signalised junction's cabinet in town. The other units are watched by \
the phones and vehicle receivers that range against them: those already \
know which unit answered, so a unit that stops answering shows up \
without a line of its own."""
affects = "kendi hattı olmayan direklerin OPEX'ini"
affects_en = "OPEX of anchors with no line of their own"

