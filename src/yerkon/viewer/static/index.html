<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YERKON</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="scene"></div>

<aside id="panel">
  <h1>YERKON</h1>
  <p class="sub" id="terrain-note">—</p>

  <section>
    <h2>Yerleşim</h2>
    <label>Koridor <output id="corridor-out"></output>
      <input type="range" id="corridor_m" min="2000" max="40000" step="1000"></label>
    <label>Direk aralığı <output id="spacing-out"></output>
      <input type="range" id="spacing_m" min="200" max="6000" step="100"></label>
    <label>Yoldan uzaklık <output id="offset-out"></output>
      <input type="range" id="offset_m" min="0" max="2000" step="50"></label>
  </section>

  <section>
    <h2>Arazi</h2>
    <label>Tepe yüksekliği <output id="relief-out"></output>
      <input type="range" id="relief_m" min="0" max="200" step="5"></label>
    <label>Tepe aralığı <output id="hill-out"></output>
      <input type="range" id="hill_spacing_m" min="500" max="10000" step="250"></label>
    <label>Yüzey pürüzü <output id="rough-out"></output>
      <input type="range" id="roughness_m" min="0" max="2" step="0.05" data-cascades></label>
    <label>Engel kaybı <output id="clutter-out"></output>
      <input type="range" id="clutter_db_per_km" min="0" max="60" step="2"></label>
  </section>

  <section>
    <h2>Donanım ve mevzuat</h2>
    <label>Bölge <select id="region" data-cascades></select></label>
    <label>Modül <select id="radio" data-cascades></select></label>
    <label>Montaj <select id="mounting" data-cascades></select></label>
    <label>Ölçüm şeması <select id="scheme"></select></label>
    <label>Menzil toleransı <output id="tol-out"></output>
      <input type="range" id="tolerance_m" min="0.5" max="30" step="0.5" data-cascades></label>
  </section>

  <section>
    <h2>Alıcı</h2>
    <label>Hız <output id="speed-out"></output>
      <input type="range" id="speed_km_h" min="0" max="160" step="5"></label>
    <label>Anten yüksekliği <output id="rxh-out"></output>
      <input type="range" id="receiver_height_m" min="0.5" max="4" step="0.1" data-cascades></label>
    <label>Yolculuk süresi <output id="journey-out"></output>
      <input type="range" id="journey_s" min="30" max="900" step="30"></label>
  </section>

  <section>
    <h2>Tarama</h2>
    <label>Hücre boyu <output id="sweep-out"></output>
      <input type="range" id="sweep_m" min="100" max="1000" step="50"></label>
    <div class="row">
      <button id="run">Simülasyonu çalıştır</button>
      <button id="reset" class="quiet">Sıfırla</button>
    </div>
  </section>

  <section id="readout">
    <h2>Sonuç</h2>
    <dl id="numbers"></dl>
  </section>

  <p class="hint">Direği sürükleyerek taşı. Shift ile tıklayarak kaldır.</p>
</aside>

<div id="confirm" hidden>
  <div class="sheet">
    <h2>Bu değişiklik başka değerleri de değiştiriyor</h2>
    <div id="confirm-body"></div>
    <div class="row">
      <button id="confirm-yes">Uygula</button>
      <button id="confirm-no" class="quiet">Vazgeç</button>
    </div>
  </div>
</div>

<div id="legend">
  <span><i class="served"></i>Konum alınabilen alan (≥4 direk)</span>
  <span><i class="reached"></i>Paketin ulaştığı alan (≥1 direk)</span>
  <span><i class="reach"></i>Tek direğin kullanılabilir menzili</span>
</div>

<div id="status"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
